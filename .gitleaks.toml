# gitleaks config for argocd-apps.
#
# SOPS-encrypted files are the *desired* state here, not findings: the values
# are ciphertext and the age recipient is a public key. Allowlist them by path
# so gitleaks stops guessing, and keep everything else in scope.
#
# This list must stay in sync with creation_rules in .sops.yaml. The
# sops-encrypted-only pre-commit hook enforces the other half of the deal —
# that these paths are never committed in plaintext.

[extend]
useDefault = true

[[allowlists]]
description = "SOPS-encrypted files — ciphertext plus a public age recipient"
paths = [
  '''helm-n8n/secrets\.yaml$''',
  '''helm-vault/auto-unseal/vault-init-secret\.yaml$''',
  '''helm-ansible-semaphore/semaphore/secret\.yaml$''',
  '''helm-openclaw/secret-.*\.yaml$''',
  '''helm-anamnestic-claw/secret\.yaml$''',
]

[[allowlists]]
description = "The age recipient is a public key by definition"
regexes = [
  '''age1wp7n5rlrjdqjx7hpkfv35ejwauuggyncl0cu4zllcq59a696sudqnucqfe''',
]
