{{- $g := .Values.ghcrMinio | default dict }}
{{- if not $g.dockerconfigjson }}
{{- fail "ghcrMinio.dockerconfigjson is empty: secrets.yaml (SOPS) not attached to the Application" }}
{{- end }}
# Pull credential for the private ghcr.io/nazmang/minio image. Same PAT as
# ghcr-silerod in namespace voice, copied into helm-minio/pull-secret/secrets.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: minio-pull-secret
    app.kubernetes.io/part-of: minio
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ $g.dockerconfigjson | quote }}
