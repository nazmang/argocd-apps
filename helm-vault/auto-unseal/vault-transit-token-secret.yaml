# Token the cluster's Vault uses against the transit Vault on dkr01 to unseal
# itself at startup. Delivered by ksops, mounted as the VAULT_TOKEN environment
# variable -- the transit seal reads the token from there, and it is the one
# seal parameter that must not sit in vault-values.yaml, which is public.
#
# Scope: update on transit/encrypt/autounseal and transit/decrypt/autounseal.
# Nothing else -- it cannot read the key, list keys, or create others.
# Periodic, 768h, renewable, orphaned so it does not expire with a parent.
