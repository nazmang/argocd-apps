# trivy-dashboard.comintern.local on the private kgateway Gateway (own MetalLB
# address, internal network and VPN only). comintern.local is not a public
# name, so the certificate is self-signed, as for MinIO. The same secret also
# fixes the Ingress, which referenced trivy-dashboard-tls without anything
# issuing it. The Ingress stays until internal DNS points at the Gateway.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trivy-dashboard-tls
  namespace: trivy-dashboard
spec:
  secretName: trivy-dashboard-tls
  dnsNames:
    - trivy-dashboard.comintern.local
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned-issuer
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: trivy-operator-dashboard-private
  namespace: trivy-dashboard
spec:
  parentRefs:
    - name: private
      namespace: kgateway-system
      sectionName: trivy-dashboard
  hostnames:
    - trivy-dashboard.comintern.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: trivy-operator-dashboard
          port: 8900
---
# HTTP -> HTTPS on the private Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: trivy-operator-dashboard-redirect
  namespace: trivy-dashboard
spec:
  parentRefs:
    - name: private
      namespace: kgateway-system
      sectionName: http
  hostnames:
    - trivy-dashboard.comintern.local
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Lets the Gateway read the TLS secret in this namespace.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: trivy-dashboard-tls-for-gateway
  namespace: trivy-dashboard
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: kgateway-system
  to:
    - group: ""
      kind: Secret
      name: trivy-dashboard-tls
