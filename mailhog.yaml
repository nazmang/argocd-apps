apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mailhog
  namespace: argocd
spec:  
  project: local
  sources:
    - repoURL: https://codecentric.github.io/helm-charts
      targetRevision: 5.8.0
      chart: mailhog
      helm:
        valueFiles:
          - $values/helm-mailhog/values.yaml
          # SOPS-encrypted, and deliberately WITHOUT a secrets:// prefix:
          # ArgoCD requires $ref at the start of a value-file string, so the
          # prefix cannot be used in a multi-source Application. Decryption
          # relies on HELM_SECRETS_WRAPPER_ENABLED=true on argocd-repo-server,
          # which wraps helm itself. See docs/argocd-repo-server-helm-secrets.md.
          - $values/helm-mailhog/secrets.yaml
    - repoURL: https://github.com/nazmang/argocd-apps.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: mailhog
  syncPolicy:
    automated: {}
    syncOptions:
        - CreateNamespace=true