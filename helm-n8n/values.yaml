replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: n8nio/n8n
  tag: "2.33.3"
  pullPolicy: IfNotPresent

port: 5678

env:
  N8N_HOST: ktulu.srvx.cc
  N8N_PROTOCOL: https
  N8N_PORT: "5678"
  WEBHOOK_URL: https://ktulu.srvx.cc/
  N8N_EDITOR_BASE_URL: https://ktulu.srvx.cc/
  GENERIC_TIMEZONE: Europe/Sofia
  N8N_BASIC_AUTH_ACTIVE: "true"

# Sensitive values (N8N_ENCRYPTION_KEY, N8N_BASIC_AUTH_USER, N8N_BASIC_AUTH_PASSWORD)
# come from the SOPS-encrypted templates/secret.yaml, not from here.

persistence:
  enabled: true
  storageClass: nfs-client
  accessModes:
    - ReadWriteOnce
  size: 2Gi

service:
  type: ClusterIP
  port: 5678

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    external-dns.alpha.kubernetes.io/hostname: ktulu.srvx.cc
    external-dns.alpha.kubernetes.io/target: b16e4df1-2f22-4512-a7bc-29b1ed11d754.cfargotunnel.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
  hosts:
    - host: ktulu.srvx.cc
      paths:
        - path: /
          pathType: Prefix
  tls: []

httproute:
  enabled: false
  parentRefs:
    - name: gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - ktulu.srvx.cc

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

securityContext:
  fsGroup: 1000

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# Video rendering (replaces the external Shotstack API). n8n creates one
# short-lived Job per render; nothing runs while no video is being made, so
# there is no Deployment, Service or ingress here - only the identity n8n uses
# and a count cap. The Job itself is renderd-job-template.yaml, which Helm does
# NOT render; it is the body 01d POSTs to the kube API.
#
# KNOWN GAP (raised 2026-09-07): these secrets are created by hand and nothing
# in git says they must exist, so a cluster rebuild cannot restore them. The
# repo already has .sops.yaml + an age key (that is how n8n-secrets is stored)
# and a Vault install, so either route fits; the MinIO root password is the one
# deliberate exception that stays out of git. Backlogged, not solved here.
#
# Two secrets are created by hand in this namespace, never committed:
#
#   renderd-minio      - MinIO credentials (created 2026-09-07, see below)
#   ghcr-renderd       - pull secret for the private ghcr.io/nazmang package:
#     kubectl -n n8n create secret docker-registry ghcr-renderd \
#       --docker-server=ghcr.io --docker-username=nazmang \
#       --docker-password=<PAT with read:packages>
#
# The render pod does NOT use root and does not use n8n's own credential. It
# authenticates as a MinIO *service account* named "renderd", issued under the
# existing hand-made user "bg-coast-news" (which n8n itself uses) and therefore
# inheriting policy bg-coast-news-rw: Get/PutObject on bg-coast-news-assets/*
# plus ListBucket - no DeleteObject, and no visibility of any other bucket
# (thanos and review-audio are invisible to it; verified 2026-09-07).
#
# Issued with, and revocable by:
#   mc admin user svcacct add l bg-coast-news --access-key renderd --secret-key <generated>
#   mc admin user svcacct rm  l renderd
#
# Neither the user's own password nor the root password was needed for renderd
# and neither was rotated: a service account is MinIO's mechanism for exactly
# this, and rotating either would have broken n8n's working credential.
#
# KNOWN RISK, kube API over unverified TLS: 01d's Create Render Job and Get Job
# Status talk to https://kubernetes.default.svc with allowUnauthorizedCerts,
# because the API server's certificate is signed by the cluster CA and n8n's
# HTTP node has no trust store for it. The ServiceAccount token above rides
# that channel on every render, and it never expires. Traffic stays inside the
# cluster, but nothing authenticates the server end. The CA is present in every
# pod at /var/run/secrets/kubernetes.io/serviceaccount/ca.crt; wiring it in
# needs an n8n SSL credential holding that PEM, which is a manual step nobody
# has taken yet. Same class as the MinIO note above, higher stakes.
#
# NOT DONE, needs a decision: helm-tutor's images are cosign-signed and a
# Kyverno ClusterPolicy enforces it, but that policy matches only
# "ghcr.io/nazmang/ai-language-tutor*", so renderd images are unsigned and
# unverified. Either extend the practice or record that it is out of scope.
renderd:
  enabled: true
  # Blast-radius cap only (see templates/renderd-quota.yaml). Counts FINISHED
  # Jobs too until their TTL expires, so it must clear a realistic burst: two
  # renders per article, several articles within one TTL window.
  maxJobs: "10"
