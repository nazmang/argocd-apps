replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: n8nio/n8n
  tag: "2.33.3"
  pullPolicy: IfNotPresent

port: 5678

env:
  N8N_HOST: ktulu.srvx.cc
  N8N_PROTOCOL: https
  N8N_PORT: "5678"
  WEBHOOK_URL: https://ktulu.srvx.cc/
  N8N_EDITOR_BASE_URL: https://ktulu.srvx.cc/
  GENERIC_TIMEZONE: Europe/Sofia
  N8N_BASIC_AUTH_ACTIVE: "true"

  # Metrics, added 2026-09-11. Until now n8n published nothing at all: when it
  # "slowed down and fell over" the only evidence was somebody noticing. The
  # default metrics are the ones that answer that complaint -- event loop lag
  # says the process is stalling, heap says why.
  #
  # /metrics is served on N8N_PORT, so the existing Service port carries it.
  N8N_METRICS: "true"
  N8N_METRICS_INCLUDE_DEFAULT_METRICS: "true"
  N8N_METRICS_INCLUDE_CACHE_METRICS: "true"
  N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS: "true"
  # Per-endpoint API metrics: which call is slow, not just "something is slow".
  N8N_METRICS_INCLUDE_API_ENDPOINTS: "true"
  N8N_METRICS_INCLUDE_API_PATH_LABEL: "true"
  N8N_METRICS_INCLUDE_API_METHOD_LABEL: "true"
  N8N_METRICS_INCLUDE_API_STATUS_CODE_LABEL: "true"
  # Workflow id as a label is deliberately OFF: it is unbounded cardinality in
  # a Prometheus with 10 days of retention and no persistent volume. The
  # failure counters below are per-workflow-name already.
  N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: "false"

# Secret values live in helm-n8n/secrets.yaml — a SOPS-encrypted *values* file,
# not a manifest. ArgoCD supplies it via `secrets://secrets.yaml` (see n8n.yaml);
# locally, render with `-f <(sops -d helm-n8n/secrets.yaml)`.
# Keys here become keys of the n8n-secrets Secret, which deployment.yaml loads
# wholesale with envFrom — so a key name here is an env var name in the pod.
# Left empty on purpose: templates/secret.yaml fails the render, naming the
# missing keys, rather than create an empty or partial Secret.
# n8n.yaml lists secrets.yaml after values.yaml so this placeholder can never be
# the winning definition. That ordering is conservative, not load-bearing:
# tested 2026-09-07, the reverse order renders identically, because Helm's map
# merge will not let an empty map wipe a populated one. Keep the order; don't
# rely on it.
secrets: {}

persistence:
  enabled: true
  storageClass: nfs-client
  accessModes:
    - ReadWriteOnce
  size: 2Gi

service:
  type: ClusterIP
  port: 5678

# Prometheus scraping. The ServiceMonitor needs the `release: prometheus` label
# or the operator ignores it -- kube-prometheus-stack selects on that label, and
# trivy-operator's ServiceMonitor sat unscraped for months precisely because it
# lacked it.
monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: prometheus

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    external-dns.alpha.kubernetes.io/hostname: ktulu.srvx.cc
    external-dns.alpha.kubernetes.io/target: b16e4df1-2f22-4512-a7bc-29b1ed11d754.cfargotunnel.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
  hosts:
    - host: ktulu.srvx.cc
      paths:
        - path: /
          pathType: Prefix
  tls: []

httproute:
  enabled: false
  parentRefs:
    - name: gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - ktulu.srvx.cc

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

securityContext:
  fsGroup: 1000

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# Video rendering (replaces the external Shotstack API). n8n creates one
# short-lived Job per render; nothing runs while no video is being made, so
# there is no Deployment, Service or ingress here - only the identity n8n uses
# and a count cap. The Job itself is renderd-job-template.yaml, which Helm does
# NOT render; it is the body 01d POSTs to the kube API.
#
# RESOLVED 2026-09-08: renderd-minio and ghcr-renderd used to be created by hand
# and existed nowhere in git, so a cluster rebuild could not restore them. They
# now come from helm-n8n/secrets.yaml (encrypted values) via
# templates/renderd-secrets.yaml, like every other secret in this chart. The
# MinIO *root* password stays out of git deliberately - renderd authenticates as
# a scoped service account, not as root.
#
# The render pod does NOT use root and does not use n8n's own credential. It
# authenticates as a MinIO *service account* named "renderd", issued under the
# existing hand-made user "bg-coast-news" (which n8n itself uses) and therefore
# inheriting policy bg-coast-news-rw: Get/PutObject on bg-coast-news-assets/*
# plus ListBucket - no DeleteObject, and no visibility of any other bucket
# (thanos and review-audio are invisible to it; verified 2026-09-07).
#
# Issued with, and revocable by:
#   mc admin user svcacct add l bg-coast-news --access-key renderd --secret-key <generated>
#   mc admin user svcacct rm  l renderd
#
# Neither the user's own password nor the root password was needed for renderd
# and neither was rotated: a service account is MinIO's mechanism for exactly
# this, and rotating either would have broken n8n's working credential.
#
# KNOWN RISK, kube API over unverified TLS: 01d's Create Render Job and Get Job
# Status talk to https://kubernetes.default.svc with allowUnauthorizedCerts,
# because the API server's certificate is signed by the cluster CA and n8n's
# HTTP node has no trust store for it. The ServiceAccount token above rides
# that channel on every render, and it never expires. Traffic stays inside the
# cluster, but nothing authenticates the server end. The CA is present in every
# pod at /var/run/secrets/kubernetes.io/serviceaccount/ca.crt; wiring it in
# needs an n8n SSL credential holding that PEM, which is a manual step nobody
# has taken yet. Same class as the MinIO note above, higher stakes.
#
# NOT DONE, needs a decision: helm-tutor's images are cosign-signed and a
# Kyverno ClusterPolicy enforces it, but that policy matches only
# "ghcr.io/nazmang/ai-language-tutor*", so renderd images are unsigned and
# unverified. Either extend the practice or record that it is out of scope.
renderd:
  enabled: true
  # Blast-radius cap only (see templates/renderd-quota.yaml). Counts FINISHED
  # Jobs too until their TTL expires, so it must clear a realistic burst: two
  # renders per article, several articles within one TTL window.
  maxJobs: "10"
