replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: n8nio/n8n
  tag: "2.37.7"
  pullPolicy: IfNotPresent

port: 5678

env:
  N8N_HOST: ktulu.srvx.cc
  N8N_PROTOCOL: https
  N8N_PORT: "5678"
  WEBHOOK_URL: https://ktulu.srvx.cc/
  N8N_EDITOR_BASE_URL: https://ktulu.srvx.cc/
  GENERIC_TIMEZONE: Europe/Sofia
  N8N_BASIC_AUTH_ACTIVE: "true"

  # Metrics, added 2026-09-11. Until now n8n published nothing at all: when it
  # "slowed down and fell over" the only evidence was somebody noticing. The
  # default metrics are the ones that answer that complaint -- event loop lag
  # says the process is stalling, heap says why.
  #
  # /metrics is served on N8N_PORT, so the existing Service port carries it.
  # n8n sits behind ingress-nginx, which sets X-Forwarded-For. Without this
  # Express does not trust the header, so n8n logged a ValidationError on every
  # request and saw the proxy's address instead of the client's -- which also
  # means rate limiting and any IP-based logic were counting one client.
  N8N_PROXY_HOPS: "1"

  # Execution history retention. Nothing pruned it, and the SQLite database
  # reached 1.36 GB -- on NFS, where every fsync crosses the network. Measured
  # before this: p95 response time at the ingress sat at 10 seconds.
  #
  # Seven days is what was asked for. Note what pruning does and does not do:
  # it deletes rows, so new work stops piling on, but SQLite does not return
  # freed pages to the filesystem. The file stays 1.36 GB until a VACUUM
  # rewrites it -- see DB_SQLITE_VACUUM_ON_STARTUP below.
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "168"

  # A ceiling as well as an age, because a burst can put a week's worth of
  # executions in a day. 20000 rows is roughly where this database was
  # comfortable.
  EXECUTIONS_DATA_PRUNE_MAX_COUNT: "20000"

  N8N_METRICS: "true"
  N8N_METRICS_INCLUDE_DEFAULT_METRICS: "true"
  N8N_METRICS_INCLUDE_CACHE_METRICS: "true"
  N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS: "true"
  # Per-endpoint API metrics: which call is slow, not just "something is slow".
  N8N_METRICS_INCLUDE_API_ENDPOINTS: "true"
  N8N_METRICS_INCLUDE_API_PATH_LABEL: "true"
  N8N_METRICS_INCLUDE_API_METHOD_LABEL: "true"
  N8N_METRICS_INCLUDE_API_STATUS_CODE_LABEL: "true"
  # Workflow id as a label is deliberately OFF: it is unbounded cardinality in
  # a Prometheus with 10 days of retention and no persistent volume. The
  # failure counters below are per-workflow-name already.
  N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: "false"

# Secret values live in helm-n8n/secrets.yaml — a SOPS-encrypted *values* file,
# not a manifest. ArgoCD supplies it via `secrets://secrets.yaml` (see n8n.yaml);
# locally, render with `-f <(sops -d helm-n8n/secrets.yaml)`.
# Keys here become keys of the n8n-secrets Secret, which deployment.yaml loads
# wholesale with envFrom — so a key name here is an env var name in the pod.
# Left empty on purpose: templates/secret.yaml fails the render, naming the
# missing keys, rather than create an empty or partial Secret.
# n8n.yaml lists secrets.yaml after values.yaml so this placeholder can never be
# the winning definition. That ordering is conservative, not load-bearing:
# tested 2026-09-07, the reverse order renders identically, because Helm's map
# merge will not let an empty map wipe a populated one. Keep the order; don't
# rely on it.
secrets: {}

# Which database n8n uses. Switching this to postgresdb is the whole migration
# from the chart's point of view: the deployment renders the DB_* variables and
# n8n creates its schema on first start. The SQLite file on the PVC is left
# untouched, so flipping back to sqlite is a complete rollback.
#
# The Postgres below is the pgvector/pg16 container on dkr01 that already
# serves the tutor app -- a separate database and a separate role, created
# 2026-09-11. Two caveats worth carrying: it is one container on one node's
# local disk, and nothing backs it up yet.
#
# DB_POSTGRESDB_PASSWORD lives in secrets.yaml and reaches the pod through
# n8n-secrets, like every other secret here.
database:
  # Switched from sqlite on 2026-09-11. The SQLite file had reached 1.3 GB on
  # the nfs-client storage class, and that combination -- a single-writer
  # embedded database doing fsync over NFS -- is why n8n kept stalling and
  # falling over. Metrics and ten alert rules were added first; they showed the
  # problem clearly and could not fix it.
  #
  # The SQLite file is deliberately left on the PVC. Rolling back is this one
  # line, and nothing reads it while type is postgresdb.
  type: postgresdb
  postgres:
    host: 10.164.1.105
    port: 55432
    database: n8n
    user: n8n
    schema: public
    # Plain TCP: this is a hop inside the private network to the node next
    # door. If it ever leaves that network, this must become true and the
    # server needs a certificate.
    ssl: false

# VACUUM rewrites the SQLite file, returning the space freed by pruning. It is
# OFF by default on purpose: on a 1.36 GB database over NFS it takes minutes,
# and it runs at startup while n8n is not yet serving. Turn it on for exactly
# one deploy once pruning has had a chance to delete the old rows, watch the
# file shrink, then turn it off again -- leaving it on makes every restart slow.
sqliteVacuumOnStartup: false

persistence:
  enabled: true
  storageClass: nfs-client
  accessModes:
    - ReadWriteOnce
  size: 2Gi

service:
  type: ClusterIP
  port: 5678

# Monitoring objects, rendered by templates/monitoring.yaml (the canonical copy
# from chart-lib/) and templates/prometheusrule.yaml (what is specific to n8n).
# See CLAUDE.md: every chart in this repo ships its own.
monitoring:
  serviceMonitor:
    enabled: true
    port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: prometheus
  rules:
    enabled: true
    labels:
      release: prometheus
    alertPrefix: N8n
    # n8n prefixes every metric it publishes, including the Node.js ones from
    # prom-client: the series is n8n_nodejs_eventloop_lag_p99_seconds, not
    # nodejs_eventloop_lag_p99_seconds. Rules written against the unprefixed
    # names load without complaint and never fire -- which is the failure this
    # repo has now hit often enough to name.
    metricPrefix: n8n_
    workloads:
      - name: n8n
        container: n8n
      # silerod ships no metrics of its own, so the baseline is all it gets:
      # it died, it restarts, the kernel killed it, it is about to be killed.
      # No ServiceMonitor for it on purpose - there is nothing to scrape.
      - name: silerod
        container: silerod
      # The HTTP renderd (templates/renderd-http.yaml). The container name
      # is shared with the Job pods, so Restarting/OOMKilled cover both; the
      # NotAvailable rule is keyed by deployment and sees only the service.
      - name: renderd
        container: renderd
      # inboxd (templates/inboxd.yaml). Its own metrics are scraped by a
      # PodMonitor and alerted on in templates/prometheusrule-inboxd.yaml.
      - name: inboxd
        container: inboxd
    ingress:
      enabled: true
      host: ktulu.srvx.cc
      # p95 at the ingress. Measured baseline before any of this existed: p50
      # 0.42s, p95 pinned at the 10s top bucket. Five seconds is therefore not
      # an arbitrary round number -- it is comfortably above healthy behaviour
      # and well below what users were putting up with.
      slowResponseSeconds: 5

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    external-dns.alpha.kubernetes.io/hostname: ktulu.srvx.cc
    external-dns.alpha.kubernetes.io/target: b16e4df1-2f22-4512-a7bc-29b1ed11d754.cfargotunnel.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
  hosts:
    - host: ktulu.srvx.cc
      paths:
        - path: /
          pathType: Prefix
  tls: []

httproute:
  enabled: false
  parentRefs:
    - name: gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - ktulu.srvx.cc

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

securityContext:
  fsGroup: 1000

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# Video rendering (replaces the external Shotstack API). n8n creates one
# short-lived Job per render; nothing runs while no video is being made, so
# there is no Deployment, Service or ingress here - only the identity n8n uses
# and a count cap. The Job itself is renderd-job-template.yaml, which Helm does
# NOT render; it is the body 01d POSTs to the kube API.
#
# RESOLVED 2026-09-08: renderd-minio and ghcr-renderd used to be created by hand
# and existed nowhere in git, so a cluster rebuild could not restore them. They
# now come from helm-n8n/secrets.yaml (encrypted values) via
# templates/renderd-secrets.yaml, like every other secret in this chart. The
# MinIO *root* password stays out of git deliberately - renderd authenticates as
# a scoped service account, not as root.
#
# The render pod does NOT use root and does not use n8n's own credential. It
# authenticates as a MinIO *service account* named "renderd", issued under the
# existing hand-made user "bg-coast-news" (which n8n itself uses) and therefore
# inheriting policy bg-coast-news-rw: Get/PutObject on bg-coast-news-assets/*
# plus ListBucket - no DeleteObject, and no visibility of any other bucket
# (thanos and review-audio are invisible to it; verified 2026-09-07).
#
# Issued with, and revocable by:
#   mc admin user svcacct add l bg-coast-news --access-key renderd --secret-key <generated>
#   mc admin user svcacct rm  l renderd
#
# Neither the user's own password nor the root password was needed for renderd
# and neither was rotated: a service account is MinIO's mechanism for exactly
# this, and rotating either would have broken n8n's working credential.
#
# KNOWN RISK, kube API over unverified TLS: 01d's Create Render Job and Get Job
# Status talk to https://kubernetes.default.svc with allowUnauthorizedCerts,
# because the API server's certificate is signed by the cluster CA and n8n's
# HTTP node has no trust store for it. The ServiceAccount token above rides
# that channel on every render, and it never expires. Traffic stays inside the
# cluster, but nothing authenticates the server end. The CA is present in every
# pod at /var/run/secrets/kubernetes.io/serviceaccount/ca.crt; wiring it in
# needs an n8n SSL credential holding that PEM, which is a manual step nobody
# has taken yet. Same class as the MinIO note above, higher stakes.
#
# NOT DONE, needs a decision: helm-tutor's images are cosign-signed and a
# Kyverno ClusterPolicy enforces it, but that policy matches only
# "ghcr.io/nazmang/ai-language-tutor*", so renderd images are unsigned and
# unverified. Either extend the practice or record that it is out of scope.
renderd:
  enabled: true
  # Blast-radius cap only (see templates/renderd-quota.yaml). Counts FINISHED
  # Jobs too until their TTL expires, so it must clear a realistic burst: two
  # renders per article, several articles within one TTL window.
  maxJobs: "10"

  # renderd as a long-running HTTP service (templates/renderd-http.yaml),
  # deployed NEXT TO the Job model above, not instead of it. 01d still creates
  # Jobs; it moves to POST renderd:8080 in its own cutover, and only a week
  # after that do the Job pieces (job template, RBAC, quota) come out. Spec:
  # bg-coast-news docs/superpowers/specs/2026-09-15-renderd-http-service-design.md.
  http:
    enabled: true
    image:
      repository: ghcr.io/nazmang/renderd
      # 0.2.x is the service CMD; 0.1.x is the one-shot Job. Bump on every
      # code change, same rule as the Job template.
      # 0.4.0: v2 request blocks (format up to 4K UHD, blur fit, overlays,
      # preview PNG) and /v1/capabilities. Rollback: 0.3.2.
      tag: "0.4.0"
      pullPolicy: IfNotPresent
    port: 8080
    # ffmpeg pool and queue depth beyond it (more -> 429). Spec §6.
    workers: 2
    queueMax: 10
    # x264 threads PER render. workers x threads <= limits.cpu, see template.
    threads: 2
    resultTtlSeconds: 3600
    ffmpegTimeoutSeconds: 180
    # Accepted debt, not a setting to copy -- see CLAUDE.md "Known gaps".
    s3Verify: "false"
    # Starting point, to be revised from a week of real renders (user's
    # decision: empirical, not fixed up front). One Job render today: ~25 s
    # at 2 CPU; RSS was never measured, which is the first thing to read off
    # the "Память по контейнерам" panel.
    resources:
      requests:
        cpu: "1"
        memory: 512Mi
      limits:
        cpu: "4"
        memory: 2Gi
    dataSize: 4Gi
    nodeSelector:
      renderd: "allowed"

# Draft text-to-speech (Silero v5_ru, CPU) for the video pipeline: the voice
# the operator hears before approving, so ElevenLabs is paid once per video
# instead of once per rework loop. Rendered by templates/silerod.yaml -
# Deployment + ClusterIP Service `silerod:8080` + a PVC that holds the model
# weights across restarts (first start downloads them; after that the pod is
# offline-capable). Contract and design: bg-coast-news
# docs/superpowers/specs/2026-09-15-silero-draft-tts-design.md; source and
# image: bg-coast-news/silerod/.
#
# No secrets: nothing here is added to n8n-secrets or to secrets.yaml. The
# only Secret referenced is the ghcr-renderd pull secret, shared with renderd.
silerod:
  enabled: true
  image:
    repository: ghcr.io/nazmang/silerod
    # Bump on every code change, as with renderd: a stale tag with a new
    # env var is a service that silently ignores its configuration.
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  port: 8080
  # v5_ru is what was evaluated (2026-09-07); v5_5_ru exists and loads the
  # same way if the voices are ever compared again.
  model: v5_ru
  # torch intra-op threads; keep equal to limits.cpu (see the comment in the
  # template).
  threads: 2
  # Spec §5. Measured before this existed: nothing - the 3 GiB limit is the
  # spec's ceiling for torch + v5_ru weights + a 48 kHz buffer, to be
  # tightened once the pod has been watched under real requests.
  resources:
    requests:
      cpu: "1"
      memory: 1.5Gi
    limits:
      cpu: "2"
      memory: 3Gi
  persistence:
    storageClass: nfs-client
    # v5_ru.pt is 145 MB; 5 Gi leaves room for a second model and torch's
    # own cache without ever thinking about it again.
    size: 5Gi
  # Keep it off the control-plane nodes, which are the memory-tight ones -
  # same label the render Jobs use, applied by hand: see
  # renderd-job-template.yaml.
  nodeSelector:
    renderd: "allowed"

# inboxd: the Telegram bot taking news submissions from the audience, handing
# accepted ones to n8n through a webhook. Rendered by templates/inboxd.yaml
# (Deployment + PodMonitor), templates/inboxd-secrets.yaml (Secret from
# inboxdSecrets in secrets.yaml) and templates/prometheusrule-inboxd.yaml.
# Spec: bg-coast-news docs/superpowers/specs/2026-09-17-inboxd-telegram-submissions-design.md.
#
# State lives in Postgres: database and role `inboxd` on the same pgvector
# container on dkr01 that serves n8n and tutor (created 2026-09-17 the same
# way as n8n's, verified by logging in as the role). INBOXD_DB_URL carries the
# password and is in secrets.yaml. Same caveats as for n8n: one container on
# one node's local disk, and nothing backs it up yet.
#
# INBOXD_ID_SALT must never change once real submissions exist: sender ids
# are derived from it, so a new salt makes every known sender a stranger.
inboxd:
  enabled: true
  image:
    repository: ghcr.io/nazmang/inboxd
    # 0.1.2 is broken (SyntaxError on import) -- never deploy it.
    tag: "0.1.6"
    pullPolicy: IfNotPresent
  port: 8080
  # The n8n webhook that receives accepted submissions. TEMP first, while the
  # n8n side is tested; the production URL goes here after its publish.
  n8nWebhookUrl: "http://n8n.n8n.svc:5678/webhook/tipline-intake"
  # Accepted debt, not a setting to copy -- see CLAUDE.md "Known gaps".
  s3Verify: "false"
  # Extra non-secret env, key: value. The image's defaults cover everything
  # not listed here (bg-coast-news/inboxd/README.md has the table).
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tmpSize: 1Gi
  podMonitor:
    enabled: true
    labels:
      release: prometheus

# Secret values for inboxd live in helm-n8n/secrets.yaml under inboxdSecrets
# (INBOXD_BOT_TOKEN, INBOXD_N8N_TOKEN, INBOXD_ID_SALT, INBOXD_DB_URL). Left
# empty here on purpose: templates/inboxd-secrets.yaml fails the render,
# naming the missing keys, rather than create an empty Secret.
inboxdSecrets: {}
