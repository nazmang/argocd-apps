{{- if .Values.renderd.enabled }}
# Video rendering runs as one-shot Jobs that n8n creates itself, one per render
# (see renderd-job-template.yaml). Nothing here runs continuously: this is only
# the identity n8n authenticates with and the permission to start those Jobs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: renderd-runner
  namespace: {{ .Release.Namespace }}
---
# Long-lived token, consumed by n8n's HTTP Request nodes as an httpHeaderAuth
# credential. It is the only new trust surface this feature introduces.
apiVersion: v1
kind: Secret
metadata:
  name: renderd-runner-token
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: renderd-runner
type: kubernetes.io/service-account-token
---
# Scope: jobs only, in this namespace only. Do NOT read that as isolation.
#
# "create jobs" means "submit an arbitrary pod spec", and a pod spec can mount
# any Secret in the namespace via secretKeyRef or a volume. So this token can
# reach renderd-minio AND n8n-secrets (n8n's own encryption key and basic auth)
# by simply asking for them in a Job it creates. That is a property of the
# Kubernetes permission model, not something these rules can restrict: no
# combination of verbs on `jobs` prevents it.
#
# Realistic cost of leaking this token: full read access to every secret in the
# n8n namespace, plus arbitrary compute on the render nodes. Not "renders only".
#
# The fix, if that cost is unacceptable, is a separate namespace holding nothing
# but renderd-minio and the pull secret - then "create jobs" there really does
# buy an attacker nothing. Deliberately not done yet: it splits the render out
# of this chart again. Recorded as a decision, not an oversight (2026-09-07).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: renderd-job-runner
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: renderd-job-runner
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: renderd-job-runner
subjects:
  - kind: ServiceAccount
    name: renderd-runner
    namespace: {{ .Release.Namespace }}
{{- end }}
