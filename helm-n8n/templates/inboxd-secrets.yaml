{{- /*
  The Secret inboxd reads with envFrom. Values live under .Values.inboxdSecrets
  in helm-n8n/secrets.yaml (SOPS-encrypted), NOT under .Values.secrets: that map
  is n8n-secrets and is loaded wholesale into the n8n pod.

  Absent values fail the render rather than produce an empty Secret. The bot
  itself refuses to start without INBOXD_BOT_TOKEN, but the other three would
  surface as runtime symptoms an hour later: a webhook n8n rejects, a database
  that does not exist, and -- worst -- an empty ID_SALT, which silently changes
  every sender's id once it is set for real.
*/}}
{{- if .Values.inboxd.enabled }}
{{- $s := .Values.inboxdSecrets | default dict }}
{{- $missing := list }}
{{- range $k := list "INBOXD_BOT_TOKEN" "INBOXD_N8N_TOKEN" "INBOXD_ID_SALT" "INBOXD_DB_URL" }}
  {{- if not (get $s $k) }}{{- $missing = append $missing (printf "inboxdSecrets.%s" $k) }}{{- end }}
{{- end }}
{{- if $missing }}
  {{- fail (printf "\n\nMissing or empty value(s): %s\nThis chart must be rendered with the encrypted values file:\n  helm template n8n ./helm-n8n -f <(sops -d helm-n8n/secrets.yaml)\nArgoCD does this via `secrets://secrets.yaml` in n8n.yaml.\n" (join ", " $missing)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: inboxd-secrets
  labels:
    {{- include "inboxd.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $s }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
