{{- if .Values.monitoring.rules.enabled }}
{{- $p := .Values.monitoring.rules.metricPrefix | default "" }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "n8n.fullname" . }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
    {{- with .Values.monitoring.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    # Only what the baseline in templates/monitoring.yaml cannot know. Restarts,
    # OOM kills, memory headroom and ingress latency live there, generated for
    # every chart in this repo; duplicating them here would mean two alerts for
    # one event and two places to fix a threshold.
    - name: n8n-process
      rules:
        - alert: N8nDown
          # Distinct from the baseline's NotAvailable: the pod can be running
          # and counted as available while n8n itself has stopped answering.
          expr: |
            up{job="{{ .Release.Name }}"} == 0
          for: 3m
          labels:
            severity: critical
            app: {{ .Release.Name }}
          annotations:
            summary: "n8n is not answering scrapes"
            description: "Prometheus cannot reach n8n's metrics endpoint. If the pod is running, n8n itself is wedged."

        - alert: N8nEventLoopBlocked
          # The single most useful signal for "it hangs": Node is single
          # threaded, so sustained event-loop lag means every request queues
          # behind something synchronous holding the thread -- the shape a
          # 1.3 GB SQLite database over NFS produces. If this fires alongside
          # the baseline's SlowResponses, the cause is not capacity.
          expr: |
            {{ $p }}nodejs_eventloop_lag_p99_seconds{job="{{ .Release.Name }}"} > 1
          for: 10m
          labels:
            severity: warning
            app: {{ .Release.Name }}
          annotations:
            summary: "n8n event loop is blocked"
            description: "Node's event loop lag stayed above one second for ten minutes."

        - alert: N8nWorkflowFailures
          # n8n has no failure counter, but it has started and success
          # counters, and the gap between them over a window is exactly the
          # failures. A long window and a threshold above zero on purpose:
          # executions in flight at the edge of the window look like failures
          # for a moment, and one broken workflow is a task, not a page.
          expr: |
            (
              increase({{ $p }}workflow_started_total[1h])
              - increase({{ $p }}workflow_success_total[1h])
            ) > 3
          for: 15m
          labels:
            severity: warning
            app: {{ .Release.Name }}
          annotations:
            summary: "n8n workflows are failing"
            description: "More than three executions failed in the last hour. Check the executions list for which workflow."

        - alert: N8nHeapNearLimit
          expr: |
            {{ $p }}nodejs_heap_size_used_bytes{job="{{ .Release.Name }}"}
            / {{ $p }}nodejs_heap_size_total_bytes{job="{{ .Release.Name }}"} > 0.9
          for: 15m
          labels:
            severity: warning
            app: {{ .Release.Name }}
          annotations:
            summary: "n8n heap is above 90% of its allocated size"
            description: "Sustained high heap usage precedes both GC thrashing and an OOM kill."
{{- end }}
