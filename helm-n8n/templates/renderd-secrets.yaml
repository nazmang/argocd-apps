{{- /*
  The two Secrets the render Job needs. Both used to be created by hand with
  `kubectl create secret` and existed nowhere in git, so a cluster rebuild could
  not restore them — the gap recorded at length in values.yaml. They now come
  from helm-n8n/secrets.yaml like everything else.

  Values live under .Values.renderdMinio and .Values.ghcrRenderd, NOT under
  .Values.secrets: that map is rendered wholesale into n8n-secrets, which
  deployment.yaml loads with envFrom, so anything added there becomes an
  environment variable in the n8n pod. These belong to the render Job instead.

  As with the n8n-secrets template, an absent value fails the render rather than
  producing an empty Secret — a renderd Job that starts with blank MinIO
  credentials fails at the upload step after doing all the encoding work.
*/}}
{{- if .Values.renderd.enabled }}
{{- $minio := .Values.renderdMinio | default dict }}
{{- $ghcr := .Values.ghcrRenderd | default dict }}
{{- $missing := list }}
{{- range $k := list "s3-endpoint" "s3-key" "s3-secret" }}
  {{- if not (get $minio $k) }}{{- $missing = append $missing (printf "renderdMinio.%s" $k) }}{{- end }}
{{- end }}
{{- if not $ghcr.dockerconfigjson }}{{- $missing = append $missing "ghcrRenderd.dockerconfigjson" }}{{- end }}
{{- if $missing }}
  {{- fail (printf "\n\nMissing or empty value(s): %s\nThis chart must be rendered with the encrypted values file:\n  helm template n8n ./helm-n8n -f <(sops -d helm-n8n/secrets.yaml)\nArgoCD does this via `secrets://secrets.yaml` in n8n.yaml.\nRendering without it would create empty renderd Secrets and every render Job\nwould fail at the MinIO upload step after doing all the encoding work.\n" (join ", " $missing)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: renderd-minio
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
type: Opaque
stringData:
  s3-endpoint: {{ $minio | dig "s3-endpoint" "" | quote }}
  s3-key: {{ $minio | dig "s3-key" "" | quote }}
  s3-secret: {{ $minio | dig "s3-secret" "" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-renderd
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ $ghcr.dockerconfigjson | quote }}
{{- end }}
