{{- /*
  n8n's secret values come from helm-n8n/secrets.yaml, a SOPS-encrypted *values*
  file that ArgoCD decrypts through the helm-secrets downloader plugin
  (see n8n.yaml's valueFiles and docs/argocd-repo-server-helm-secrets.md).

  This file used to BE the SOPS-encrypted file, sitting under templates/ where
  Helm renders it verbatim — which shipped the ENC[...] ciphertext strings to
  the cluster as the actual Secret values. helm-secrets can only decrypt values
  files, never templates, so the ciphertext moved out and this became an
  ordinary template. Do not put an encrypted file under templates/ again.
*/}}
{{- $secrets := .Values.secrets | default dict }}
{{- if not $secrets.N8N_ENCRYPTION_KEY }}
  {{- fail "\n\n.Values.secrets.N8N_ENCRYPTION_KEY is empty.\nThis chart must be rendered with the encrypted values file:\n  helm template n8n ./helm-n8n -f <(sops -d helm-n8n/secrets.yaml)\nArgoCD does this via `secrets://secrets.yaml` in n8n.yaml.\nRendering without it would create an empty n8n-secrets Secret and n8n would\nsilently generate a fresh encryption key, orphaning every stored credential.\n" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
