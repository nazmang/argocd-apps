{{- /*
  n8n's secret values come from helm-n8n/secrets.yaml, a SOPS-encrypted *values*
  file that ArgoCD decrypts through the helm-secrets downloader plugin
  (see n8n.yaml's valueFiles and docs/argocd-repo-server-helm-secrets.md).

  This file used to BE the SOPS-encrypted file, sitting under templates/ where
  Helm renders it verbatim — which shipped the ENC[...] ciphertext strings to
  the cluster as the actual Secret values. helm-secrets can only decrypt values
  files, never templates, so the ciphertext moved out and this became an
  ordinary template. Do not put an encrypted file under templates/ again.
*/}}
{{- $secrets := .Values.secrets | default dict }}
{{- $required := list "N8N_ENCRYPTION_KEY" "N8N_BASIC_AUTH_USER" "N8N_BASIC_AUTH_PASSWORD" }}
{{- /* Postgres mode needs the password too, and a missing one fails in the
       worst possible way: n8n starts, cannot connect, and the pod crash-loops
       with an authentication error that looks like a server problem. */}}
{{- if eq .Values.database.type "postgresdb" }}
  {{- $required = append $required "DB_POSTGRESDB_PASSWORD" }}
{{- end }}
{{- $missing := list }}
{{- range $required }}
  {{- if not (get $secrets .) }}
    {{- $missing = append $missing . }}
  {{- end }}
{{- end }}
{{- if $missing }}
  {{- fail (printf "\n\nMissing or empty .Values.secrets key(s): %s\nThis chart must be rendered with the encrypted values file:\n  helm template n8n ./helm-n8n -f <(sops -d helm-n8n/secrets.yaml)\nArgoCD does this via `secrets://secrets.yaml` in n8n.yaml.\nRendering without every required key would ship a partial n8n-secrets Secret:\n  N8N_ENCRYPTION_KEY missing  -> n8n silently generates a fresh encryption key\n                                 and orphans every stored credential.\n  N8N_BASIC_AUTH_* missing    -> values.yaml sets N8N_BASIC_AUTH_ACTIVE=true and\n                                 ktulu.srvx.cc is reachable from the public\n                                 internet, so the login would have no\n                                 credentials behind it.\n" (join ", " $missing)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
