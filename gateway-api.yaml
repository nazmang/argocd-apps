apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-app
  namespace: argocd
spec:
  project: default
  # Upstream Gateway API CRDs, standard channel. kgateway v2.5 is built against v1.7.0.
  source:
    repoURL: "https://github.com/kubernetes-sigs/gateway-api"
    targetRevision: "v1.7.0"
    path: config/crd/standard

  destination:
    server: "https://kubernetes.default.svc"
    namespace: kube-system

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
