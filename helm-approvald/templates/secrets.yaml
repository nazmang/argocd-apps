{{- /*
  Rendered from helm-approvald/secrets.yaml, a SOPS-encrypted values file that
  ArgoCD decrypts with helm-secrets (approvald.yaml: secrets://secrets.yaml).
  Never put ciphertext under templates/.

  Every key is required. Without the bot token approvald cannot check a single
  initData and every /api call fails 401; without the n8n tokens topics neither
  arrive nor leave. A loud render failure beats a pod that runs and does
  nothing.
*/}}
{{- $s := .Values.secrets | default dict }}
{{- $env := $s.env | default dict }}
{{- $missing := list }}
{{- range list "APPROVALD_BOT_TOKEN" "APPROVALD_N8N_TOKEN" "APPROVALD_DISPATCH_TOKEN" "APPROVALD_DB_URL" "APPROVALD_ALLOWED_IDS" "APPROVALD_CHAT_ID" }}
  {{- if not (get $env .) }}{{- $missing = append $missing (printf "secrets.env.%s" .) }}{{- end }}
{{- end }}
{{- if not $s.dockerconfigjson }}{{- $missing = append $missing "secrets.dockerconfigjson" }}{{- end }}
{{- if not .Values.image.tag }}{{- $missing = append $missing "image.tag (values.yaml)" }}{{- end }}
{{- if $missing }}
  {{- fail (printf "\n\nMissing or empty value(s): %s\nRender with the encrypted values file:\n  helm template approvald ./helm-approvald -f <(sops -d helm-approvald/secrets.yaml)\nArgoCD does this via `secrets://secrets.yaml` in approvald.yaml.\n" (join ", " $missing)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "approvald.fullname" . }}-env
  labels:
    {{- include "approvald.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "approvald.fullname" . }}-ghcr
  labels:
    {{- include "approvald.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ $s.dockerconfigjson | quote }}
