{{/*
CANONICAL MONITORING TEMPLATE -- do not edit a copy.

The source of truth is chart-lib/monitoring.yaml. Every chart in this repo
carries a byte-identical copy at templates/monitoring.yaml, and the
`monitoring-template-in-sync` pre-commit hook fails if one drifts. To change
the monitoring baseline, edit the source and re-run:

    ./chart-lib/sync-monitoring.sh

Why copies rather than a library chart: a library dependency has to be resolved
by argocd-repo-server at render time, and this repo's charts are deliberately
self-contained -- a chart here renders with a plain `helm template <dir>` and no
network. The duplication is real; the hook is what keeps it honest.

Nothing here uses a chart-specific helper, so the file works unchanged in any
chart. Selector labels default to the convention every chart in this repo
follows (name = chart name, instance = release name) and can be overridden.
*/}}
{{- $mon := .Values.monitoring | default dict }}
{{- $sm := $mon.serviceMonitor | default dict }}
{{- $rules := $mon.rules | default dict }}
{{- $prefix := $rules.alertPrefix | default (.Chart.Name | replace "-" " " | title | replace " " "") }}
{{/*
  A chart may ship more than one workload (helm-tutor has three), so the rules
  iterate a list. The single-workload case stays a one-liner: leave
  monitoring.rules.workloads unset and it defaults to the release name.
*/}}
{{- $workloads := $rules.workloads | default (list (dict "name" (.Release.Name) "container" (.Chart.Name))) }}
{{- $ingress := $rules.ingress | default dict }}
{{- if $sm.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- with $sm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- if $sm.selectorLabels }}
      {{- toYaml $sm.selectorLabels | nindent 6 }}
      {{- else }}
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      {{- end }}
  endpoints:
    - port: {{ $sm.port | default "http" }}
      path: {{ $sm.path | default "/metrics" }}
      interval: {{ $sm.interval | default "30s" }}
      scrapeTimeout: {{ $sm.scrapeTimeout | default "10s" }}
{{- end }}
{{- if $rules.enabled }}
{{- if $sm.enabled }}
---
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-baseline
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- with $rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    # The baseline every workload in this repo gets, whether or not it
    # publishes a single metric of its own. All of it comes from
    # kube-state-metrics and cAdvisor, which are cluster-wide -- so an app that
    # exposes nothing is still covered for the failures that actually happen:
    # it died, it is restarting, the kernel killed it, it is about to be killed.
{{- range $w := $workloads }}
{{- $c := $w.container | default $w.name }}
    - name: {{ $.Release.Name }}-{{ $w.name }}-baseline
      rules:
        - alert: {{ $prefix }}NotAvailable
          expr: |
            kube_deployment_status_replicas_available{namespace="{{ $.Release.Namespace }}",deployment="{{ $w.name }}"}
            < kube_deployment_spec_replicas{namespace="{{ $.Release.Namespace }}",deployment="{{ $w.name }}"}
          for: {{ $rules.notAvailableFor | default "10m" }}
          labels:
            severity: critical
            app: {{ $.Release.Name }}
            workload: {{ $w.name }}
          annotations:
            summary: "{{ $w.name }} has fewer available replicas than it wants"
            description: "The deployment has been short of replicas for {{ $rules.notAvailableFor | default "10m" }}. Something is crash-looping, unschedulable, or stuck pulling an image."

        - alert: {{ $prefix }}Restarting
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="{{ $.Release.Namespace }}",container="{{ $c }}"}[{{ $rules.restartWindow | default "15m" }}]) > 0
          labels:
            severity: warning
            app: {{ $.Release.Name }}
            workload: {{ $w.name }}
          annotations:
            summary: "{{ $w.name }} restarted"
            description: "The container restarted within the last {{ $rules.restartWindow | default "15m" }}. A single restart is not an outage; a repeating one is."

        - alert: {{ $prefix }}OOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{namespace="{{ $.Release.Namespace }}",container="{{ $c }}",reason="OOMKilled"} == 1
          for: 1m
          labels:
            severity: critical
            app: {{ $.Release.Name }}
            workload: {{ $w.name }}
          annotations:
            summary: "{{ $w.name }} was OOM-killed"
            description: "The kernel killed this container for exceeding its memory limit. Either the limit is wrong or something grew that should not have."

        - alert: {{ $prefix }}MemoryNearLimit
          expr: |
            container_memory_working_set_bytes{namespace="{{ $.Release.Namespace }}",container="{{ $c }}"}
            / on(namespace,pod,container) kube_pod_container_resource_limits{namespace="{{ $.Release.Namespace }}",container="{{ $c }}",resource="memory"}
            > {{ $rules.memoryLimitRatio | default 0.85 }}
          for: 15m
          labels:
            severity: warning
            app: {{ $.Release.Name }}
            workload: {{ $w.name }}
          annotations:
            summary: "{{ $w.name }} is near its memory limit"
            description: "Working set has been above {{ $rules.memoryLimitRatio | default 0.85 }} of the limit for 15 minutes. The OOM kill is the next step, and it arrives without further warning."
{{- end }}
{{- if $ingress.enabled }}

    # Measured at the ingress rather than inside the app: this is the latency a
    # person actually waits for, and it keeps reporting when the app itself has
    # stopped answering -- which is exactly when you want to hear about it.
    - name: {{ .Release.Name }}-ingress
      rules:
        - alert: {{ $prefix }}SlowResponses
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(nginx_ingress_controller_request_duration_seconds_bucket{host="{{ $ingress.host }}"}[10m]))
            ) > {{ $ingress.slowResponseSeconds | default 5 }}
          for: 10m
          labels:
            severity: warning
            app: {{ .Release.Name }}
          annotations:
            summary: "{{ .Release.Name }} is slow: p95 above {{ $ingress.slowResponseSeconds | default 5 }}s"
            description: "95th percentile response time at {{ $ingress.host }} has been above the threshold for 10 minutes."

        - alert: {{ $prefix }}ServerErrors
          expr: |
            sum(rate(nginx_ingress_controller_requests{host="{{ $ingress.host }}",status=~"5.."}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            app: {{ .Release.Name }}
          annotations:
            summary: "{{ .Release.Name }} is returning 5xx"
            description: "{{ $ingress.host }} has served server errors continuously for 10 minutes."
{{- end }}
{{- end }}
