apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "approvald.fullname" . }}
  labels:
    {{- include "approvald.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "approvald.fullname" $ }}
                port:
                  name: http
          {{- end }}
