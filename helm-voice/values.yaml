# Shared speech services. Callers: n8n (bg-coast-news draft voiceover, HTTP to
# silerod) and Home Assistant at home (Wyoming STT, later Wyoming TTS through
# an adapter in front of silerod). Moved out of helm-n8n so one project's
# rollout cannot take the other's voice with it. DRAFT 2026-11-09, not synced.

# Namespaces allowed to call the services (NetworkPolicy ingress). Home
# Assistant does not come from a namespace - see stt.homeCidrs.
callerNamespaces:
  - n8n
  # health bot (anamnestic-claw / OpenClaw) voice replies, asked 2026-11-09
  - openclaw

silerod:
  enabled: true
  image:
    repository: ghcr.io/nazmang/silerod
    # 0.2.1: numbers read as words before synthesis (reviewed, merged to
    # bg-coast-news main as 6ebe18c). Image built by Jenkins
    # Builds/bg-coast-news/main at 3700cd2 (2026-11-09; the tag takes the sha
    # of main's HEAD at build time),
    # sha256:050daa7565a8b557531380f61d1928283f76d7edf7d8e1d238fd2f338b9ed8c6.
    # Rollback: tag "0.2.0-5dedba0"
    # (sha256:9c4d5aa5d450d5767d5b94fd1ad7bfd2789cb5bcfb0ca105ee266297fe7c5b72).
    tag: "0.2.2-2084d09"
    pullPolicy: IfNotPresent
  # Private GHCR image. Secret rendered by templates/pull-secret.yaml from
  # ghcrSilerod.dockerconfigjson in secrets.yaml (SOPS; same PAT as n8n's
  # ghcr-renderd).
  imagePullSecret: ghcr-silerod
  port: 8080
  # Wyoming TTS for Home Assistant, same process and model as HTTP. /healthz
  # is 503 until this listens too, so a broken Wyoming takes /tts out of the
  # Service as well; wyomingPort: 0 switches it off.
  wyomingPort: 10200
  # Fixed MetalLB address for HA at home (Wyoming only, HTTP stays internal).
  wyomingLoadBalancerIP: 10.164.12.61
  # Priority lock: requests up to shortChars go first; a long one waiting
  # longer than maxWaitS is not overtaken any more.
  shortChars: 200
  maxWaitS: 3
  # v5_6_ru: auto-stress and homographs; same five speakers (Женя, 2026-11-09).
  model: v5_6_ru
  threads: 2
  # Voice per client, changed here only (Женя 2026-11-09). Clients send the
  # alias as speaker/voice. Speakers: male aidar, eugene; female baya,
  # kseniya, xenia. Needs silerod >= 0.2.0 (SILERO_VOICE_ALIASES).
  voiceAliases:
    news: eugene
    bot: xenia
    ha: baya
    katya: kseniya
  # Measured by Программист 2026-11-09: RSS 0.75 GiB on v5_6_ru.
  # CPU request 250m, not 1: idle use is ~2m and synthesis bursts up to the
  # limit. A full core reserved on k8s03 left the Jenkins build agent (pinned
  # there, 700m) unschedulable on 2026-11-09.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  persistence:
    storageClass: nfs-client
    # New PVC: weights (145 MB) download again on first start.
    size: 5Gi
  nodeSelector:
    renderd: "allowed"
  # renderd: allowed is k8s03 + k8s04, and k8s04 has 4 GiB total: on
  # 2026-11-09 it sat at 91% memory with both silerod copies (n8n and voice)
  # on it. Excluding it leaves k8s03 (56% used), same rule as stt below.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - k8s04

stt:
  enabled: true
  image:
    repository: rhasspy/wyoming-whisper
    # TBD: pin the current release after checking Docker Hub.
    tag: "2.5.0"
    pullPolicy: IfNotPresent
  port: 10300
  # medium-int8 vs small-int8: measure latency on these CPU nodes (no GPU)
  # before settling; voice-02 says ~2 GiB fits k8s01-03.
  model: medium-int8
  language: ru
  beamSize: 1
  # No CPU limit: with limit 3 on a 4-vCPU node CTranslate2 ran 4 threads
  # and got CFS-throttled (2026-11-09, 7 s per short command).
  # Request stays 1: with 2 the pod was Pending on 2026-11-09 (requested CPU
  # free: k8s01 1.56, k8s02 1.03, k8s03 0.1 of 3.3). Without a limit it still
  # bursts to idle CPU, which is what fixed the throttling.
  resources:
    requests:
      cpu: "1"
      memory: 1.5Gi
    limits:
      memory: 3Gi
  persistence:
    storageClass: nfs-client
    size: 5Gi
  nodeSelector: {}
  # Not the renderd label: it includes k8s04, which has 4 GiB total. k8s01
  # had the most free memory on 2026-11-09 (5.6 of 12.1 GiB used).
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - k8s04
  # Source ranges allowed into STT from outside the cluster (Home Assistant on
  # debian01, 192.168.88.152, arriving over WireGuard). TBD voice-05: how home
  # reaches the cluster at all - 10.164.12.0/24 is not routed from home today.
  homeCidrs:
    - 192.168.88.0/24
  # Home Assistant reaches STT through MetalLB at a fixed address (Женя,
  # 2026-11-09). Pool first-pool is 10.164.12.1-100; .1 ingress, .50 portainer.
  # Not routed from home yet: rm1 needs 10.164.12.0/24 into wireguard2.
  loadBalancerIP: 10.164.12.60

# Command recognition for Home Assistant: Vosk (small Russian model, ~50 MB,
# streaming, no 30 s Whisper window). Corrected mode snaps the transcript to
# the nearest sentence from templates/vosk-sentences.yaml; anything else
# passes through as heard. Whisper (stt) stays for free speech.
vosk:
  enabled: true
  image:
    repository: rhasspy/wyoming-vosk
    tag: "1.5.1"
    pullPolicy: IfNotPresent
  port: 10300
  language: ru
  # In wyoming-vosk 1.5.x this is an edit-distance cutoff, not 0..1
  # (tested in the pod 2026-11-09): 0.2-1 corrected nothing; 5 fixes
  # "приоткрыла шторы", "в спальня", "на кухни" and leaves "поставь музыку",
  # "включи радио", "какая погода" alone; 8 already turned "поставь музыку"
  # into "поставь на паузу".
  correctSentences: 5
  limitSentences: false
  loadBalancerIP: 10.164.12.62
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
  persistence:
    storageClass: nfs-client
    size: 1Gi
