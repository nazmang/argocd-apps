{{- if .Values.silerod.enabled }}
{{- $g := .Values.ghcrSilerod | default dict }}
{{- if not $g.dockerconfigjson }}
{{- fail "ghcrSilerod.dockerconfigjson is empty: secrets.yaml (SOPS) not attached to the Application" }}
{{- end }}
# Pull credential for the private ghcr.io/nazmang/silerod image. Same PAT as
# ghcr-renderd in namespace n8n, copied into helm-voice/secrets.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.silerod.imagePullSecret }}
  labels:
    {{- include "voice.labels" (dict "root" . "name" "silerod") | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ $g.dockerconfigjson | quote }}
{{- end }}
