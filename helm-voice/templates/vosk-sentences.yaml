{{- if .Values.vosk.enabled }}
# Sentences Vosk corrects towards (wyoming-vosk format, <lang>.yaml).
# Keep in step with Home Assistant areas, aliases and scripts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vosk-sentences
  labels:
    {{- include "voice.labels" (dict "root" . "name" "vosk") | nindent 4 }}
data:
  ru.yaml: |
    sentences:
      - "(включи|выключи) свет"
      - "(включи|выключи) свет (в|на) {area}"
      - "(включи|выключи) свет (в|на) {area} и (в|на) {area}"
      - "(включи|выключи) (люстру|подсветку)"
      - "(включи|выключи) (люстру|подсветку) в спальне"
      - "(открой|закрой|приоткрой) (шторы|штору|шторку)"
      - "(открой|закрой|приоткрой) шторы (в спальне|спальни)"
      - "(запусти|начни) уборку"
      - "(запусти|начни) уборку (в|на) {area}"
      - "(убери|пропылесось) {area_acc}"
      - "(убери|пропылесось) {area_acc} и {area_acc}"
      - "останови (уборку|пылесос)"
      - "пылесос (домой|на базу)"
      - "(спокойной|доброй) ночи"
      - "ночной режим"
      - "(обратно в норму|обычный свет)"
      - "какая (температура|влажность) (в|на) {area}"
      - "(сделай|поставь) (громче|тише)"
      - "(поставь на паузу|пауза|продолжи)"
      - "который час"
    lists:
      area:
        values:
          - кухне
          - спальне
          - гостиной
          - коридоре
          - ванной
          - кладовке
          - балконе
      area_acc:
        values:
          - кухню
          - спальню
          - гостиную
          - коридор
{{- end }}
