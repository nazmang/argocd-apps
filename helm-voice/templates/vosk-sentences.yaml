{{- if .Values.vosk.enabled }}
# Sentences Vosk corrects towards (wyoming-vosk format, <lang>.yaml).
# Keep in step with Home Assistant areas, aliases and scripts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vosk-sentences
  labels:
    {{- include "voice.labels" (dict "root" . "name" "vosk") | nindent 4 }}
data:
  ru.yaml: |
    sentences:
      - "(включи|выключи) свет"
      - "(включи|выключи) свет (в|на) {area}"
      - "(включи|выключи) свет (в|на) {area} [и] [(в|на)] {area}"
      - "(включи|выключи) свет (в|на) {area} [(в|на)] {area} и [(в|на)] {area}"
      - "(включи|выключи) (люстру|подсветку)"
      - "(включи|выключи) (люстру|подсветку) в спальне"
      - "(открой|закрой|приоткрой) (шторы|штору|шторку)"
      - "(открой|закрой|приоткрой) шторы (в спальне|спальни)"
      - "(запусти|начни) уборку"
      - "(запусти|начни) уборку (в|на) {area}"
      - "(убери|пропылесось) {area_acc}"
      - "(убери|пропылесось) {area_acc} и {area_acc}"
      - "останови (уборку|пылесос)"
      - "пылесос (домой|на базу)"
      - "(спокойной|доброй) ночи"
      - "ночной режим"
      - "(обратно в норму|обычный свет)"
      - "какая (температура|влажность|точка росы) (в|на) {area}"
      - "(сколько градусов|сыро ли|влажно ли) (в|на) {area}"
      - "(нужно|надо|стоит) ли проветрить [(в|на) {area}]"
      - "пора проветрить [(в|на) {area}]"
      - "(сделай|поставь) (громче|тише)"
      - "(поставь на паузу|пауза|продолжи)"
      - "который час"
      # --- пакет 09.11 (Женя: копить и вливать пакетом) ---
      - "(сделай|поставь) (люстру|подсветку|свет) [в спальне] (ярче|темнее|теплее|холоднее)"
      - "(поставь|установи|сделай) яркость (люстры|подсветки|света) [в спальне] [на] {percent} [процентов]"
      - "(включи|выключи) (тёплый|теплый) пол"
      - "какая температура пола"
      - "(включи|выключи) [режим] не беспокоить"
      - "(включи|выключи) тихий режим"
      - "[(включи|запусти)] режим (секс|романтика)"
      - "(поставь|запусти|заведи) таймер на {number} (минут|минуту|минуты|секунд|секунду|секунды|час|часа)"
      - "сколько осталось [на таймере]"
      - "(отмени|останови|выключи) таймер"
      - "какая погода [(сегодня|завтра)]"
      - "какая температура на улице"
      - "(открыто|закрыто) ли окно [в спальне]"
      - "окно [в спальне] (открыто|закрыто)"
      - "(где|куда уехал) пылесос"
      - "(включи|выключи) (музыку|радио|телевизор)"
      - "(следующий|предыдущий) трек"
      - "(поставь|сделай) (ярче|темнее|теплее|холоднее)"
      - "(поставь|установи|сделай) яркость на {percent} [процентов]"
      - "сделай свет (в|на) {area} (ярче|темнее|теплее|холоднее)"
      - "(какая температура|сколько градусов) на улице"
      - "сколько осталось на таймере"
      - "что с пылесосом"
      - "сколько заряда у пылесоса"
      - "я (ушёл|ухожу|дома|пришёл|вернулся)"
      - "(закрой|сделай) всё на ночь"
      - "всё на ночь"
      - "отбой"
      - "(доброе утро|с добрым утром)"
      - "(включи|выключи) (сушилку|тихий режим)"
    lists:
      percent:
        values: ["десять", "двадцать", "тридцать", "сорок", "пятьдесят", "шестьдесят", "семьдесят", "восемьдесят", "девяносто", "сто"]
      number:
        values: ["один", "одну", "две", "два", "три", "четыре", "пять", "шесть", "семь", "восемь", "девять", "десять", "пятнадцать", "двадцать", "тридцать", "сорок пять", "полчаса"]
      area:
        values:
          - кухне
          - спальне
          - гостиной
          - коридоре
          - ванной
          - кладовке
          - балконе
      area_acc:
        values:
          - кухню
          - спальню
          - гостиную
          - коридор
{{- end }}
