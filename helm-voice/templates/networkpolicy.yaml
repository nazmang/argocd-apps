    matchLabels:
      {{- include "voice.selectorLabels" (dict "root" . "name" "vosk") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.stt.homeCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: wyoming
{{- end }}
