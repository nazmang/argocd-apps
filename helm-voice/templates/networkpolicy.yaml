        - podSelector: {}
        {{- range .Values.stt.homeCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: wyoming
{{- if .Values.vosk.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
