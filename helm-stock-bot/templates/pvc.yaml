apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "stockBot.fullname" . }}-data
  labels:
    {{- include "stockBot.labels" . | nindent 4 }}
  annotations:
    # The database lives here; deleting the app must not delete it.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- if .Values.backup.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "stockBot.fullname" . }}-backup
  labels:
    {{- include "stockBot.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteMany]
  storageClassName: {{ .Values.backup.storageClass }}
  resources:
    requests:
      storage: {{ .Values.backup.size }}
{{- end }}
