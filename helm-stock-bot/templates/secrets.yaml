{{- /*
  Rendered from helm-stock-bot/secrets.yaml, a SOPS-encrypted values file that
  ArgoCD decrypts with helm-secrets (stock-bot.yaml: secrets://secrets.yaml).
  Never put ciphertext under templates/.

  The bot refuses to start without BOT_TOKEN, ANTHROPIC_API_KEY or
  ALLOWED_USER_IDS; failing the render here is louder than a crash loop.
*/}}
{{- $s := .Values.secrets | default dict }}
{{- $env := $s.env | default dict }}
{{- $missing := list }}
{{- range list "BOT_TOKEN" "ANTHROPIC_API_KEY" "ALLOWED_USER_IDS" }}
  {{- if not (get $env .) }}{{- $missing = append $missing (printf "secrets.env.%s" .) }}{{- end }}
{{- end }}
{{- if not $s.dockerconfigjson }}{{- $missing = append $missing "secrets.dockerconfigjson" }}{{- end }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" (.Values.image.digest | default "")) }}{{- $missing = append $missing "image.digest (values.yaml, sha256:<64 hex>)" }}{{- end }}
{{- if $missing }}
  {{- fail (printf "\n\nMissing or empty value(s): %s\nRender with the encrypted values file:\n  helm template stock-bot ./helm-stock-bot -f <(sops -d helm-stock-bot/secrets.yaml)\nArgoCD does this via `secrets://secrets.yaml` in stock-bot.yaml.\n" (join ", " $missing)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stockBot.fullname" . }}-secrets
  labels:
    {{- include "stockBot.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stockBot.fullname" . }}-ghcr
  labels:
    {{- include "stockBot.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ $s.dockerconfigjson | quote }}
