# semaphore.srvx.cc on the private kgateway Gateway (own MetalLB address,
# reachable only from the internal network and VPN), TLS ends on the Gateway.
# Sits next to the Ingress until DNS (external-dns target on the Ingress)
# points at the Gateway address.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: semaphore-tls
  namespace: semaphore
spec:
  secretName: semaphore-tls
  dnsNames:
    - semaphore.srvx.cc
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-dns
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ansible-semaphore-private
  namespace: semaphore
spec:
  parentRefs:
    - name: private
      namespace: kgateway-system
      sectionName: semaphore
  hostnames:
    - semaphore.srvx.cc
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ansible-semaphore
          port: 3000
---
# HTTP -> HTTPS on the private Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ansible-semaphore-redirect
  namespace: semaphore
spec:
  parentRefs:
    - name: private
      namespace: kgateway-system
      sectionName: http
  hostnames:
    - semaphore.srvx.cc
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Lets the Gateway read the TLS secret in this namespace.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: semaphore-tls-for-gateway
  namespace: semaphore
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: kgateway-system
  to:
    - group: ""
      kind: Secret
      name: semaphore-tls
