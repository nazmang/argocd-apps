apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: local
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault
      targetRevision: 0.30.1
      helm:
        valueFiles:
          - $values/helm-vault/vault-values.yaml
    - repoURL: https://github.com/nazmang/argocd-apps.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/nazmang/argocd-apps.git
      targetRevision: main
      path: helm-vault/vault-config
    - repoURL: https://github.com/nazmang/argocd-apps.git
      targetRevision: main
      path: helm-vault/auto-unseal
      kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # vault-agent-injector writes its own CA into the webhook at runtime; the
  # chart ships it empty, so the object was permanently OutOfSync and
  # selfHeal resynced it every few minutes (2026-09-20).
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
