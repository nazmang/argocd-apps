apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tutor-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nazmang/ai-language-tutor.git
    targetRevision: main
    path: k8s/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
