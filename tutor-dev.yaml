apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tutor-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nazmang/argocd-apps.git
    targetRevision: main
    path: helm-tutor
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
