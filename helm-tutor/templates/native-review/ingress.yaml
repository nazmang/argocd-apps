apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: native-review
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"  # дефолт ingress-nginx — 1m, аудиозаметки крупнее
    external-dns.alpha.kubernetes.io/hostname: review.srvx.cc
    external-dns.alpha.kubernetes.io/target: b16e4df1-2f22-4512-a7bc-29b1ed11d754.cfargotunnel.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - review.srvx.cc
      secretName: native-review-tls
  rules:
    - host: review.srvx.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: native-review
                port:
                  number: 80
