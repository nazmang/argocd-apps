apiVersion: batch/v1
kind: CronJob
metadata:
  name: tutor-generate-tomorrow
  namespace: {{ .Release.Namespace }}
  labels:
    app: tutor-generate-tomorrow
spec:
  # Включена 2026-09-21 решением владельца. До этого стояла suspend: true
  # с момента создания (LAST SCHEDULE: <none> за 38 дней): пул наполнялся
  # бы карточками старого промпта. Включена после v24 (правило про термины,
  # починка полей в партийном пути, тест партии с фальшивым шлюзом) — см.
  # docs/39 за 2026-09-20/21. systemd-таймер на 10.164.1.105 снят ещё
  # 2026-08-12 (TODO.md), двойного запуска нет.
  #
  # Партия идёт под ночным контекстом (BATCH_CONTEXT): таймаут 120 с, вердикт
  # допуска с откатом на дневной. Первое, что смотреть утром в логе Job:
  # «партией принято N из M», «поле … переписано», и ни одного
  # helper_text_written_in_target — под ночным контекстом их быть не должно.
  suspend: false
  # 03:00 UTC + activeDeadlineSeconds 5400 → готово к 04:30, ученики с 05:00.
  # На будущее: если партию отдать DeepSeek, двигать на 00:00 UTC — 03:00
  # внутри его пикового окна по будням (01:00–04:00 UTC).
  schedule: "0 3 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Без повторов: как и systemd Type=oneshot без Restart=, повторный
      # прогон после сбоя означал бы двойной расход бюджета партии.
      backoffLimit: 0
      # 90 минут — тот же запас, что TimeoutStartSec в systemd-юните:
      # партия ждёт до часа плюс добор обычными вызовами.
      activeDeadlineSeconds: 5400
      template:
        metadata:
          labels:
            app: tutor-generate-tomorrow
        spec:
          restartPolicy: Never
          {{- include "tutor.imagePullSecrets" . | nindent 10 }}
          containers:
            - name: tutor-generate-tomorrow
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: Always
              command:
                - python
                - scripts/generate-tomorrow.py
                - --batch
                - --budget
                - "1.00"
              envFrom:
                - secretRef:
                    name: tutor-db
                - secretRef:
                    name: tutor-llm-keys
                # Озвучку ночная заготовка сегодня не трогает, но секрет
                # подключён ЗАРАНЕЕ и намеренно: без него `VoiceService`
                # не собирается МОЛЧА, одной строкой в лог. Ровно так
                # 2026-09-09 кнопка 🔊 полдня висела в уроке, не работая
                # ни разу. Тихий отказ дороже лишней строки в манифесте.
                - secretRef:
                    name: tutor-review-audio
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
              securityContext:
                {{- include "tutor.securityContext" . | nindent 16 }}
