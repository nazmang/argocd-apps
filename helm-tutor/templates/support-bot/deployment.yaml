apiVersion: apps/v1
kind: Deployment
metadata:
  name: tutor-support-bot
  namespace: {{ .Release.Namespace }}
  labels:
    app: tutor-support-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tutor-support-bot
  template:
    metadata:
      labels:
        app: tutor-support-bot
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      {{- include "tutor.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: tutor-support-bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          command: ["python", "-m", "tutor.adapters.telegram.support"]
          envFrom:
            - secretRef:
                name: tutor-support-bot
          # 194Mi в покое при потолке 256Mi — тот же обрыв, что у бота
          # (OOMKilled 2026-09-09), просто ещё не сработавший: саппорт-бот
          # никто не нагружает. Ждать, пока сработает, незачем — числа те
          # же и по той же причине.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          securityContext:
            {{- include "tutor.securityContext" . | nindent 12 }}
