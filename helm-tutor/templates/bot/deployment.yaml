apiVersion: apps/v1
kind: Deployment
metadata:
  name: tutor-bot
  namespace: {{ .Release.Namespace }}
  labels:
    app: tutor-bot
spec:
  replicas: 1
  strategy:
    type: Recreate  # long polling: два пода дерутся за getUpdates (docs/17)
  selector:
    matchLabels:
      app: tutor-bot
  template:
    metadata:
      labels:
        app: tutor-bot
      annotations:
        reloader.stakater.com/auto: "true"  # рестарт при ротации tutor-llm-keys / tutor-db
    spec:
      {{- include "tutor.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: tutor-bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          command: ["python", "-m", "tutor.adapters.telegram"]
          envFrom:
            - secretRef:
                name: tutor-db
            - secretRef:
                name: tutor-llm-keys
            # Хранилище клипов озвучки. Тот же секрет и тот же бакет, что у
            # native-review; у бота его не было, и `VoiceService` молча не
            # собирался — кнопка 🔊 висела на каждой карточке, не работая
            # ни разу (живой урок 2026-09-09).
            - secretRef:
                name: tutor-review-audio
          env:
            - name: TUTOR_ADMIN_IDS
              value: "534896303"
            - name: TUTOR_APP_VERSION
              value: {{ .Values.image.tag | quote }}
            # Без этой переменной строка «Поддержка» в /help не
            # показывается вовсе (docs/14 § Поддержка), и бот поддержки
            # остаётся развёрнутым, но недостижимым: политика приватности
            # отправляет за удалением данных именно к нему.
            - name: SUPPORT_BOT_USERNAME
              value: "maistor_krypkata_bot"
          # ПАМЯТЬ: 201Mi В ПОКОЕ ПРИ ПОТОЛКЕ 256Mi — запаса 55Mi, и его
          # съедает одна генерация. Живой OOMKilled 2026-09-09 09:07:39
          # (exitCode 137) пришёл секунда в секунду с ответом модели на
          # первую карточку урока: процесс умер НА ПИКЕ, а не при выкате.
          #
          # `requests` подняты до фактического покоя, а не оставлены вдвое
          # ниже него: планировщик считал под 128-мегабайтным, то есть
          # вдвое легче, чем он есть, и ставил его исходя из этого.
          #
          # `limits` 512Mi — НЕ «удвоить на глаз». Известно: покой 201Mi,
          # и всплеск, переваливший за 256Mi, то есть больше 55Mi. Точная
          # величина пика НЕ ИЗМЕРЕНА — её нечем было снять, под умирал
          # раньше. 512Mi оставляет над покоем 311Mi, то есть впятеро
          # больше уже наблюдавшегося всплеска; это запас до замера, а не
          # ответ. Померить пик после выката (`kubectl top` во время
          # генерации либо `container_memory_max_usage_bytes`) и ужать
          # число до измеренного + запас.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          securityContext:
            {{- include "tutor.securityContext" . | nindent 12 }}
