# Накат схемы БД — ДО того, как поднимутся поды нового образа.
#
# ЗАЧЕМ ЭТО ПОЯВИЛОСЬ. До 2026-09-09 миграции не накатывал никто: в чарте
# не было ни Job, ни initContainer, а `docs/17` § Probes при этом описывал
# `startupProbe` как «миграции применены» — то есть документ подразумевал
# накат, которого не существовало. Боевая база стояла на 0044, код в
# образе ждал 0045 (`touch_first_exposure` пишет `due_at = NULL`, колонка
# оставалась `NOT NULL`), и первая же экспозиция нового слова упала бы с
# нарушением ограничения. Не выстрелило только потому, что ученик в тот
# день не занимался.
#
# ПОЧЕМУ HOOK, А НЕ initContainer. В одну базу смотрят ЧЕТЫРЕ воркорда:
# бот, саппорт-бот, native-review и CronJob заготовки. initContainer
# защищает только тот Deployment, к которому пришит: остальные три
# стартуют на старой схеме и падают ровно так же, только позже и в другом
# логе. Хук — одна точка на весь релиз, и он единственный, кто может
# сказать «нет» ДО того, как что-либо начнёт подниматься.
#
# ПОЧЕМУ ЭТО ОСТАНАВЛИВАЕТ ВЫКАТ. Helm-хук `pre-upgrade` ArgoCD переводит
# в фазу `PreSync`: упавший PreSync прекращает синхронизацию целиком, и
# ни один Deployment не обновляется. Поды остаются на прежнем образе,
# совместимом с прежней схемой. Это и есть требуемое поведение: не
# подняться на несовместимой схеме лучше, чем подняться и молча
# деградировать.
#
# ПОВТОРНЫЕ ПРОГОНЫ БЕЗОПАСНЫ. `selfHeal: true` синхронизирует при каждом
# расхождении, то есть хук будет запускаться часто. `alembic upgrade head`
# на базе, уже стоящей на head, не делает ничего — это не «терпимо», а
# штатный режим: подавляющее большинство запусков этого Job будут
# пустыми.
#
# ЕСЛИ БАЗА ВПЕРЕДИ ОБРАЗА — ХУК УПАДЁТ, И ЭТО НЕ ЕГО ПОЛОМКА. `head`
# берётся из миграций ОБРАЗА; ревизию, которой в образе нет, alembic не
# может даже прочитать («Can't locate revision»), и PreSync остановит
# синк. Так вышло 2026-09-09: боевую довели руками до 0046 при выкаченном
# образе с миграциями по 0045. Ручной накат — только до именованной
# ревизии (`upgrade 0045`), не до `head`: `head` в рабочем дереве
# сдвигается каждым слиянием и утаскивает схему невыехавших фич.
# Лечится не откатом схемы, а выкатом образа, который эту ревизию знает.
#
# ЧЕГО ЭТОТ ХУК НЕ ДЕЛАЕТ, и это надо знать. Он накатывает схему ПОКА
# СТАРЫЕ ПОДЫ ЕЩЁ ЖИВЫ — PreSync по определению идёт до обновления
# воркордов. Значит миграция обязана быть совместимой со старым кодом
# (expand-contract): добавить колонку, ослабить ограничение, завести
# таблицу — можно; удалить или сузить то, чем старый код ещё пользуется, —
# нельзя в один релиз, это два. Дежурный пример правильного случая — сама
# 0045: `NOT NULL` → `NULL` старый код не ломает.
apiVersion: batch/v1
kind: Job
metadata:
  name: tutor-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    app: tutor-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    # Единственный хук в чарте; вес задан явно, чтобы следующий добавленный
    # не оказался «одновременно с миграциями» по умолчанию.
    helm.sh/hook-weight: "-5"
    # НЕ `hook-succeeded`: упавший Job — единственное место, где написано,
    # ПОЧЕМУ выкат остановился. Он остаётся до следующей попытки и
    # удаляется перед ней.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  # Повтор здесь уместен, в отличие от CronJob заготовки: там повторный
  # прогон означает двойной расход бюджета партии, здесь — ничего.
  # Миграция идёт в транзакции (DDL в PostgreSQL транзакционен), а
  # `upgrade head` идемпотентен, поэтому две лишние попытки покрывают
  # обычную причину отказа в кластере — база ещё не приняла соединение —
  # и ничего не портят, если причина другая.
  backoffLimit: 2
  # Десять минут: миграции проекта — секунды. Больше означало бы, что
  # выкат стоит и ждёт того, что уже не произойдёт.
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: tutor-migrate
    spec:
      restartPolicy: Never
      {{- include "tutor.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: tutor-migrate
          # ТОТ ЖЕ образ, что у воркордов, и это существенно: схему
          # накатывает та версия, которая сейчас поедет, а не та, что
          # лежала в кластере до неё.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          # `python -m alembic`, а не `alembic`: консольный скрипт зависит
          # от того, куда uv положил bin, а модуль резолвится тем же
          # интерпретатором, что и приложение.
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            # Только доступ к базе. Ключи моделей (`tutor-llm-keys`) сюда
            # НЕ подключаются: миграции к моделям не ходят, а лишний
            # секрет в поде — лишняя поверхность.
            - secretRef:
                name: tutor-db
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            {{- include "tutor.securityContext" . | nindent 12 }}
