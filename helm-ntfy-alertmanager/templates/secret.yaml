{{- /*
  The rendered config carries the ntfy access token, so it is a Secret rather
  than a ConfigMap -- see the rule in CLAUDE.md. The token itself comes from the
  SOPS-encrypted secrets.yaml at the chart root; this file is an ordinary
  template over .Values and must never hold ciphertext itself.
*/}}
{{- if not .Values.secrets }}
{{- fail "helm-ntfy-alertmanager: .Values.secrets is missing. The ntfy access token lives in the SOPS-encrypted helm-ntfy-alertmanager/secrets.yaml -- render with `-f <(sops -d helm-ntfy-alertmanager/secrets.yaml)`, and check that ntfy-alertmanager.yaml still lists `secrets://secrets.yaml`." }}
{{- end }}
{{- if not .Values.secrets.ntfyAccessToken }}
{{- fail "helm-ntfy-alertmanager: secrets.ntfyAccessToken is empty. Without it every notification is refused by ntfy with 401 and the alerts silently go nowhere -- which is the exact failure this bridge was deployed to end." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ntfy-alertmanager.fullname" . }}
  labels:
    {{- include "ntfy-alertmanager.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.scfg: |
    http-address :{{ .Values.service.port }}
    log-level {{ .Values.config.logLevel }}
    log-format {{ .Values.config.logFormat }}
    alert-mode {{ .Values.config.alertMode }}

    labels {
        order "{{ .Values.config.labels.order }}"
    {{- range $sev, $cfg := .Values.config.labels.severity }}

        severity "{{ $sev }}" {
            priority {{ $cfg.priority }}
            tags "{{ $cfg.tags }}"
        }
    {{- end }}
    }

    resolved {
        update-notification {{ .Values.config.resolved.updateNotification }}
        tags "{{ .Values.config.resolved.tags }}"
        priority {{ .Values.config.resolved.priority }}
    }

    ntfy {
        server {{ .Values.config.ntfy.server }}
        topic {{ .Values.config.ntfy.topic }}
        access-token {{ .Values.secrets.ntfyAccessToken }}
        markdown {{ .Values.config.ntfy.markdown }}
    {{- if eq .Values.config.alertMode "single" }}
        generator-url-label {{ .Values.config.ntfy.generatorUrlLabel }}
    {{- end }}
    }

    cache {
        type {{ .Values.config.cache.type }}
        duration {{ .Values.config.cache.duration }}
        cleanup-interval {{ .Values.config.cache.cleanupInterval }}
    }
