apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ntfy-alertmanager.fullname" . }}
  labels:
    {{- include "ntfy-alertmanager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ntfy-alertmanager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Rolls the pod when the config changes. The bridge reads its config only
        # at startup, so without this a token or priority change would sit in the
        # Secret and never take effect.
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "ntfy-alertmanager.labels" . | nindent 8 }}
    spec:
      containers:
        - name: ntfy-alertmanager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -config
            - /etc/ntfy-alertmanager/config.scfg
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # The bridge serves only the webhook endpoint -- it exposes no health
          # path -- so liveness is a TCP connect. A process that has stopped
          # listening is the failure this can actually detect.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy-alertmanager
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          secret:
            secretName: {{ include "ntfy-alertmanager.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
