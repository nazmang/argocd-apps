# ntfy credential for the Alertmanager bridge -- SOPS-encrypted, consumed as a
# Helm VALUES file via `secrets://secrets.yaml` in ntfy-alertmanager.yaml.
#
# This is the same alertmgr token Uptime Kuma publishes with. Sharing it is a
# deliberate simplification: both are alert publishers to the same topic, and a
# second token would have to be declared in helm-ntfy's authTokens as well,
# because ntfy refuses tokens it has not provisioned. The cost is that rotating
