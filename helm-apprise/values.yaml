replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: caronc/apprise
  tag: latest
  pullPolicy: IfNotPresent

port: 8000

env: 
  # APPRISE_CONFIG_DIR: /config
  # APPRISE_ATTACH_DIR: /attach
  # APPRISE_PLUGIN_PATHS: /plugin
  TZ: Europe/Athens

persistence:
  enabled: true
  storageClass: nfs-client
  accessModes:
    - ReadWriteOnce
  size: 1Gi

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  annotations: 
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    external-dns.alpha.kubernetes.io/hostname: apprise.srvx.cc
    external-dns.alpha.kubernetes.io/target: b16e4df1-2f22-4512-a7bc-29b1ed11d754.cfargotunnel.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
  hosts:
    - host: apprise.srvx.cc
      paths:
        - path: /
          pathType: Prefix
  tls: []

httproute:
  enabled: false
  parentRefs:
    - name: gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - apprise.srvx.cc

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

securityContext:
  fsGroup: 65534

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# Monitoring objects, rendered by templates/monitoring.yaml -- the canonical
# copy from chart-lib/. See CLAUDE.md: every chart in this repo ships its own
# ServiceMonitor and PrometheusRule, because a workload whose monitoring is
# created by hand somewhere else is a workload that will one day be deployed
# without it and nobody will notice.
monitoring:
  serviceMonitor:
    # apprise publishes no metrics endpoint. Left off rather than deleted, so
    # the next person sees the decision instead of wondering.
    enabled: false
  rules:
    enabled: true
    labels:
      release: prometheus
    alertPrefix: Apprise
    workloads:
      - name: apprise
        container: apprise
    ingress:
      enabled: true
      host: apprise.srvx.cc
      slowResponseSeconds: 5
