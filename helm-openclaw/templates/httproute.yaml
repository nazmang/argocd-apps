{{- if .Values.httpRoute.enabled }}
{{- $gw := .Values.httpRoute.gateway }}
# Routes on the private kgateway Gateway (own MetalLB address, TLS on the
# Gateway, externalTrafficPolicy Local). They sit next to the Ingress until
# DNS (external-dns target on the Ingress) points at the Gateway address.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "openclaw.fullname" . }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gw.name }}
      namespace: {{ $gw.namespace }}
      sectionName: openclaw
  hostnames: [{{ .Values.ingress.host | quote }}]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ include "openclaw.fullname" . }}
          port: {{ .Values.service.port }}
{{- if .Values.sandboxIngress.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "openclaw.fullname" . }}-sandbox
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gw.name }}
      namespace: {{ $gw.namespace }}
      sectionName: openclaw-sandbox
  hostnames: [{{ .Values.sandboxIngress.host | quote }}]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ include "openclaw.fullname" . }}
          port: {{ .Values.service.sandboxPort }}
{{- end }}
---
# HTTP -> HTTPS, as ssl-redirect on the Ingress.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "openclaw.fullname" . }}-redirect
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gw.name }}
      namespace: {{ $gw.namespace }}
      sectionName: http
  hostnames:
    - {{ .Values.ingress.host | quote }}
    {{- if .Values.sandboxIngress.enabled }}
    - {{ .Values.sandboxIngress.host | quote }}
    {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Lets the Gateway read the TLS secrets in this namespace.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ include "openclaw.fullname" . }}-tls-for-gateway
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: {{ $gw.namespace }}
  to:
    - group: ""
      kind: Secret
      name: {{ .Values.ingress.tls.secretName }}
    {{- if .Values.sandboxIngress.enabled }}
    - group: ""
      kind: Secret
      name: {{ .Values.sandboxIngress.tlsSecretName }}
    {{- end }}
{{- end }}
