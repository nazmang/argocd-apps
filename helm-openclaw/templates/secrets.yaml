{{- /*
  The three Secrets this chart needs, rendered from helm-openclaw/secrets.yaml —
  a SOPS-encrypted *values* file ArgoCD decrypts through the helm-secrets plugin
  (see openclaw.yaml's valueFiles and docs/argocd-repo-server-helm-secrets.md).

  Until 2026-09-08 these were three encrypted *manifests* at the chart root,
  applied by hand with `sops -d | kubectl apply` before every `helm upgrade`,
  because ArgoCD had no way to decrypt anything. Keeping them out of templates/
  was the whole point back then: Helm renders everything under templates/
  verbatim and knows nothing about SOPS. That constraint has not gone away — it
  is why the ciphertext now lives in a values file and this template contains no
  ciphertext at all. Never put an encrypted file under templates/.

  health-plugin-token is gated on healthPlugin.enabled together with the
  initContainer that consumes it, so the chart never asks for a Secret it has no
  consumer for. Its BACKEND_TOKEN must equal helm-anamnestic-claw's
  API_BEARER_TOKEN — Kubernetes Secrets do not cross namespaces, so the value is
  duplicated, and rotating one without the other breaks the plugin's calls.
*/}}
{{- $s := .Values.secrets | default dict }}
{{- $ba := $s.basicAuth | default dict }}
{{- $gt := $s.gatewayToken | default dict }}
{{- $missing := list }}
{{- if not $ba.auth }}{{- $missing = append $missing "secrets.basicAuth.auth" }}{{- end }}
{{- if not $ba.password }}{{- $missing = append $missing "secrets.basicAuth.password" }}{{- end }}
{{- if not $gt.OPENCLAW_GATEWAY_TOKEN }}{{- $missing = append $missing "secrets.gatewayToken.OPENCLAW_GATEWAY_TOKEN" }}{{- end }}
{{- if .Values.healthPlugin.enabled }}
  {{- if not (($s.healthPluginToken | default dict).BACKEND_TOKEN) }}{{- $missing = append $missing "secrets.healthPluginToken.BACKEND_TOKEN" }}{{- end }}
{{- end }}
{{- if $missing }}
  {{- fail (printf "\n\nMissing or empty value(s): %s\nThis chart must be rendered with the encrypted values file:\n  helm template openclaw ./helm-openclaw -f <(sops -d helm-openclaw/secrets.yaml)\nArgoCD does this via `secrets://secrets.yaml` in openclaw.yaml.\nRendering without it would create empty Secrets: the gateway would reject every\nrequest and nginx Basic Auth would fail closed.\n" (join ", " $missing)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: openclaw-basic-auth
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  # `auth` is the bcrypt htpasswd line nginx-ingress needs for auth-type: basic.
  # `password` is the same password in plaintext so a human can log into the UI.
  auth: {{ $ba.auth | quote }}
  password: {{ $ba.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: openclaw-gateway-token
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: {{ $gt.OPENCLAW_GATEWAY_TOKEN | quote }}
{{- if .Values.healthPlugin.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: health-plugin-token
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  BACKEND_TOKEN: {{ ($s.healthPluginToken | default dict).BACKEND_TOKEN | quote }}
{{- end }}
