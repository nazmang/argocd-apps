{{- /* Отдельно от monitoring.yaml: тот файл синхронизируется из chart-lib. */}}
{{- if and .Values.backup.enabled .Values.monitoring.rules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "openclaw.fullname" . }}-backup
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
    {{- with .Values.monitoring.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "openclaw.fullname" . }}-backup
      rules:
        - alert: {{ .Values.monitoring.rules.alertPrefix }}BackupStale
          expr: |
            (time() - max(kube_cronjob_status_last_successful_time{namespace="{{ .Release.Namespace }}", cronjob="{{ include "openclaw.fullname" . }}-backup"})) > {{ mul .Values.backup.staleAfterHours 3600 }}
            or absent(kube_cronjob_status_last_successful_time{namespace="{{ .Release.Namespace }}", cronjob="{{ include "openclaw.fullname" . }}-backup"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Нет успешного бэкапа OpenClaw дольше {{ .Values.backup.staleAfterHours }} ч"
        - alert: {{ .Values.monitoring.rules.alertPrefix }}BackupFailing
          expr: |
            kube_job_status_failed{namespace="{{ .Release.Namespace }}", job_name=~"{{ include "openclaw.fullname" . }}-backup-.*"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Джоб бэкапа OpenClaw падает"
{{- end }}
