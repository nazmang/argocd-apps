apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openclaw.fullname" . }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "openclaw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openclaw.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      automountServiceAccountToken: false
      initContainers:
        # The nfs-client provisioner creates the PVC's subPath directories as
        # root:root 0777. Files inside are ours (uid 1000), but 2026.9 also
        # chmod()s ~/.openclaw itself -- `plugins install`, `doctor`, exec
        # approvals -- and a non-owner gets EPERM, which crash-looped the
        # plugin bootstrap on 2026-09-18. Hand the two directories to the
        # gateway's uid once; idempotent, and the only step that needs root.
        - name: fix-home-owner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -c
            - |
              set -e
              chown {{ .Values.securityContext.runAsUser }}:{{ .Values.securityContext.fsGroup }} /home/node/.openclaw /home/node/.config/openclaw
              chmod 700 /home/node/.openclaw
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
              subPath: openclaw-home
            - name: data
              mountPath: /home/node/.config/openclaw
              subPath: openclaw-config
        - name: gateway-config-bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /home/node/.openclaw
              # Migrate a config written by an older gateway before touching it:
              # 2026.9 rejects every `config set` while the file has legacy keys
              # (first hit: meta.lastTouchedAt from 2026.7.x -> "OpenClaw config
              # is invalid", initContainer crash-loop). `openclaw doctor --fix`
              # refuses to even start on that key, so strip it first; then let
              # doctor run the remaining migrations (session store, state db)
              # that the gateway insists on before it will boot. Both are
              # no-ops on a current config.
              node -e '
                const fs = require("fs");
                const f = process.env.HOME + "/.openclaw/openclaw.json";
                if (!fs.existsSync(f)) process.exit(0);
                const c = JSON.parse(fs.readFileSync(f, "utf8"));
                if (c.meta && "lastTouchedAt" in c.meta) {
                  delete c.meta.lastTouchedAt;
                  fs.writeFileSync(f, JSON.stringify(c, null, 2));
                  console.log("stripped legacy meta.lastTouchedAt");
                }'
              openclaw doctor --fix --non-interactive </dev/null
              openclaw config set gateway.mode local
              openclaw config set gateway.bind lan
              openclaw config set gateway.controlUi.allowedOrigins '["{{ .Values.env.allowedOrigins }}"]'
              openclaw config set plugins.entries.device-pair.enabled true
              openclaw config set plugins.entries.device-pair.config.publicUrl '{{ .Values.env.publicUrl }}'
              openclaw config set agents.defaults.model.primary '{{ .Values.env.model }}'
              openclaw config set gateway.trustedProxies '{{ .Values.env.trustedProxies }}'
              openclaw config set talk.provider openai
              openclaw config set talk.speechLocale '{{ .Values.env.voice.speechLocale }}'
              openclaw config set talk.realtime.provider openai
              openclaw config set talk.realtime.mode realtime
              openclaw config set talk.realtime.transport gateway-relay
              openclaw config set talk.realtime.model '{{ .Values.env.voice.realtimeModel }}'
              openclaw config set tools.media.audio.enabled true
              openclaw config set tools.media.audio.language '{{ .Values.env.voice.audioLanguage }}'
              openclaw config set tts.enabled true
              openclaw config set tts.provider openai
              openclaw config set models.mode merge
              openclaw config set models.providers.deepseek --strict-json '{{ dict "baseUrl" .Values.env.deepseek.baseUrl "api" "openai-completions" "apiKey" "${DEEPSEEK_API_KEY}" "models" .Values.env.deepseek.models | toJson }}'
              # plugins.allow must stay UNSET on 2026.9: it is an allowlist for
              # every plugin, bundled providers included (see values.yaml). The
              # 2026.7.33 bootstrap wrote ["health-plugin"] to this PVC; remove
              # it, tolerating "already unset".
              openclaw config unset plugins.allow || true
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
              subPath: openclaw-home
            - name: data
              mountPath: /home/node/.config/openclaw
              subPath: openclaw-config
{{- if .Values.healthPlugin.enabled }}
        # The plugin image only supplies the plugin's files. It bundles its own
        # (older) openclaw CLI, and running the install with that CLI broke on
        # the 2026.9.4 upgrade twice over: it does not know
        # --accept-capabilities, and it cannot open the state database once the
        # gateway's own bootstrap has migrated it (schema 17 vs 1). So: copy the
        # source out here, and let the gateway's CLI -- same image, same
        # version -- do the install in the next initContainer.
        - name: health-plugin-src
          image: "{{ .Values.healthPlugin.image.repository }}:{{ .Values.healthPlugin.image.tag }}"
          imagePullPolicy: {{ .Values.healthPlugin.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["sh", "-c", "cp -r /plugin-src/. /work/plugin-src/"]
          volumeMounts:
            - name: plugin-src
              mountPath: /work/plugin-src
        - name: health-plugin-bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: BACKEND_URL
              value: {{ .Values.healthPlugin.backendUrl | quote }}
            - name: BACKEND_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.healthPlugin.tokenSecretName }}
                  key: BACKEND_TOKEN
            - name: DEFAULT_USER_ID
              value: {{ .Values.healthPlugin.defaultUserId | quote }}
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /home/node/.openclaw
              # Install BEFORE configuring. OpenClaw validates the whole config
              # against the installed plugins' schemas, so setting a key for a
              # plugin it does not know yet fails with
              #   Config validation failed: plugins: Unrecognized key: "health-plugin"
              # The original order had these the other way round, which is one
              # of the reasons this initContainer had never run successfully.
              # --accept-capabilities: 2026.9 refuses to install a plugin that
              # declares capabilities without explicit consent (exit 1, no
              # install) -- with strategy: Recreate that is an outage.
              openclaw plugins install --force --accept-capabilities /work/plugin-src
              # Config lives at plugins.entries.<id>.config.<key> - note both
              # the "entries" and "config" levels. plugins.<id>.<key> is not a
              # valid path and is rejected by the schema.
              openclaw config set plugins.entries.health-plugin.config.backendUrl "$BACKEND_URL"
              openclaw config set plugins.entries.health-plugin.config.backendToken "$BACKEND_TOKEN"
              openclaw config set plugins.entries.health-plugin.config.defaultUserId "$DEFAULT_USER_ID"
              openclaw config set plugins.entries.health-plugin.enabled true
          volumeMounts:
            - name: plugin-src
              mountPath: /work/plugin-src
            - name: data
              mountPath: /home/node/.openclaw
              subPath: openclaw-home
            - name: data
              mountPath: /home/node/.config/openclaw
              subPath: openclaw-config
{{- end }}
      containers:
        - name: openclaw
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Values.modelKeysSecretName }}
          env:
            - name: OPENCLAW_TZ
              value: {{ .Values.env.tz | quote }}
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gatewayTokenSecretName }}
                  key: OPENCLAW_GATEWAY_TOKEN
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
              subPath: openclaw-home
            - name: data
              mountPath: /home/node/.config/openclaw
              subPath: openclaw-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "openclaw.fullname" . }}
{{- if .Values.healthPlugin.enabled }}
        - name: plugin-src
          emptyDir: {}
{{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
