image:
  repository: ghcr.io/openclaw/openclaw
  tag: "2026.7.1-2"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 18789

persistence:
  storageClass: nfs-client
  accessModes:
    - ReadWriteOnce
  size: 5Gi

env:
  tz: UTC
  # consumed by the gateway-config-bootstrap initContainer's
  # `openclaw config set gateway.controlUi.allowedOrigins` call — there is
  # no working env var for this setting (OPENCLAW_ALLOWED_ORIGINS is not
  # read by the gateway; see commands.md)
  allowedOrigins: "https://openclaw.srvx.cc"

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 512Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
affinity: {}
tolerations: []

ingress:
  enabled: true
  className: nginx
  host: openclaw.srvx.cc
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/auth-type: basic
    # must match secret-basic-auth.yaml's metadata.name
    nginx.ingress.kubernetes.io/auth-secret: openclaw-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "OpenClaw Gateway"
    external-dns.alpha.kubernetes.io/hostname: openclaw.srvx.cc
    external-dns.alpha.kubernetes.io/target: b16e4df1-2f22-4512-a7bc-29b1ed11d754.cfargotunnel.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"

gatewayTokenSecretName: openclaw-gateway-token

healthPlugin:
  # Enabled 2026-09-08, once nazman/anamnestic-claw-plugin:main was finally built
  # and pushed. Before that the image did not exist at all, which is why this
  # initContainer sat in the chart but never in the cluster — and why the flag
  # exists: with strategy: Recreate a missing image is an outage, not a degraded
  # rollout, because the old pod is torn down first.
  #
  # The image is built from ../anamnestic-claw/plugin (Dockerfile there), on the
  # same openclaw base tag as image.tag above so plugin and core cannot drift
  # apart. Rebuild and push after any change to that source — "main" is mutable,
  # which is why pullPolicy below is Always.
  #
  # health-plugin-token is gated on this same flag, so the Secret and its only
  # consumer appear and disappear together.
  enabled: true
  image:
    repository: nazman/anamnestic-claw-plugin
    tag: "main"
    # Always (not IfNotPresent): tag is a floating "main" tag, so a node
    # that already cached an older "main" image must still pull the latest
    # digest on every pod start, or plugin updates can silently never land.
    pullPolicy: Always
  backendUrl: "http://anamnestic-claw.anamnestic-claw.svc.cluster.local:8000"
  tokenSecretName: health-plugin-token
