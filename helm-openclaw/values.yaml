image:
  repository: ghcr.io/openclaw/openclaw
  # 2026.9.4 (current line) since 2026-09-18. The Android app (2026.7.4)
  # speaks the 2026.9 protocol: models.list with `view`, sessions.observer.*,
  # question.list, and full/limited pairing access. On both 2026.7.1 and
  # 2026.7.33 those calls failed (unknown param / "missing scope:
  # operator.admin", a scope the app never requests), so the app kept every
  # chat message queued "until reconnect". Verified in a throwaway pod before
  # this bump: health-plugin installs on 2026.9.4 (needs --accept-capabilities)
  # and loads all seven tools. Two 2026.9 behaviours the bootstrap accounts for:
  #   - `plugins install` refuses without --accept-capabilities;
  #   - `plugins.allow` is an allowlist for EVERY plugin, bundled ones included
  #     (["health-plugin"] left only memory-core + health-plugin enabled, no
  #     anthropic provider, no device-pair) -- so it must stay unset.
  tag: "2026.9.4"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 18789

persistence:
  storageClass: nfs-client
  accessModes:
    - ReadWriteOnce
  size: 5Gi

env:
  tz: UTC
  # consumed by the gateway-config-bootstrap initContainer's
  # `openclaw config set gateway.controlUi.allowedOrigins` call — there is
  # no working env var for this setting (OPENCLAW_ALLOWED_ORIGINS is not
  # read by the gateway; see commands.md)
  allowedOrigins: "https://openclaw.srvx.cc"
  # Advertised in mobile pairing setup codes / QR (Control UI "Pair device",
  # `openclaw qr`) via `plugins.entries.device-pair.config.publicUrl`. Without
  # it the code falls through to the last resolution step, `gateway.bind=lan`,
  # and embeds the pod IP (`ws://10.233.x.x:18789`) -- unreachable from a phone.
  # Must be wss:// -- pairing fails closed on public ws:// (2026-09-18).
  # The bundled device-pair plugin is disabled by default; the bootstrap
  # enables it, otherwise every CLI call warns "plugin disabled but config is
  # present" (the QR still honoured the URL, but the config belongs to it).
  publicUrl: "wss://openclaw.srvx.cc"
  # Default agent model, `provider/model`. Written to agents.defaults.model.primary
  # by the bootstrap. Until 2026-09-18 nothing was set and no provider had a
  # key, so `openclaw models status` showed the stock placeholder openai/gpt-5.5
  # with zero providers and the agent could not answer at all.
  model: "anthropic/claude-sonnet-5"

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 512Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
affinity: {}
tolerations: []

ingress:
  enabled: true
  className: nginx
  host: openclaw.srvx.cc
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # No nginx Basic Auth in front of the gateway any more (owner's decision,
    # 2026-09-18): the browser prompt doubled up with OpenClaw's own
    # authentication -- gateway token plus device pairing -- and that layer is
    # now the only perimeter on this public host. If a second layer is wanted
    # again, prefer Cloudflare Access over auth-type: basic.
    external-dns.alpha.kubernetes.io/hostname: openclaw.srvx.cc
    external-dns.alpha.kubernetes.io/target: b16e4df1-2f22-4512-a7bc-29b1ed11d754.cfargotunnel.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"

gatewayTokenSecretName: openclaw-gateway-token
# Provider API keys (ANTHROPIC_API_KEY) -- see templates/secrets.yaml.
modelKeysSecretName: openclaw-model-keys

healthPlugin:
  # Enabled 2026-09-08, after the plugin was ported to the OpenClaw 2026.7.x
  # plugin API. Two separate problems had to be fixed before this could be true:
  #
  #   1. nazman/anamnestic-claw-plugin:main did not exist on Docker Hub at all.
  #   2. Once built, it still would not install: the plugin was written against
  #      an older API (bare default-export register function, ctx.config.get,
  #      handler(args), no id/configSchema/contracts.tools in the manifest).
  #
  # Verified in a container before flipping this: `openclaw plugins install`
  # succeeds and `openclaw plugins inspect health-plugin --runtime --json`
  # reports status=loaded, activated=true and all seven tools. The first attempt
  # at enabling this skipped that check and took openclaw down - with
  # strategy: Recreate, a plugin that cannot start is an outage, not a degraded
  # rollout, which is precisely why this flag exists. Do not flip it without
  # running the install in a container first.
  #
  # The image is built from ../anamnestic-claw/plugin on the same openclaw base
  # tag as image.tag above, so plugin and core cannot drift apart. Rebuild and
  # push after any change to that source - "main" is mutable, hence
  # pullPolicy: Always below.
  #
  # health-plugin-token is gated on this same flag, so the Secret and its only
  # consumer appear and disappear together.
  enabled: true
  image:
    repository: nazman/anamnestic-claw-plugin
    tag: "main"
    # Always (not IfNotPresent): tag is a floating "main" tag, so a node
    # that already cached an older "main" image must still pull the latest
    # digest on every pod start, or plugin updates can silently never land.
    pullPolicy: Always
  backendUrl: "http://anamnestic-claw.anamnestic-claw.svc.cluster.local:8000"
  tokenSecretName: health-plugin-token

# Monitoring objects, rendered by templates/monitoring.yaml -- the canonical
# copy from chart-lib/. See CLAUDE.md: every chart in this repo ships its own
# ServiceMonitor and PrometheusRule, because a workload whose monitoring is
# created by hand somewhere else is a workload that will one day be deployed
# without it and nobody will notice.
monitoring:
  serviceMonitor:
    # /metrics returns the web UI's HTML -- the SPA answers every unknown path.
    # There is no instrumentation to scrape.
    enabled: false
  rules:
    enabled: true
    labels:
      release: prometheus
    alertPrefix: Openclaw
    workloads:
      - name: openclaw
        container: openclaw
