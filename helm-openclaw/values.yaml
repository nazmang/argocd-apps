image:
  repository: ghcr.io/openclaw/openclaw
  # 2026.9.4 (current line) since 2026-09-18. The Android app (2026.7.4)
  # speaks the 2026.9 protocol: models.list with `view`, sessions.observer.*,
  # question.list, and full/limited pairing access. On both 2026.7.1 and
  # 2026.7.33 those calls failed (unknown param / "missing scope:
  # operator.admin", a scope the app never requests), so the app kept every
  # chat message queued "until reconnect". Verified in a throwaway pod before
  # this bump: health-plugin installs on 2026.9.4 (needs --accept-capabilities)
  # and loads all seven tools. Two 2026.9 behaviours the bootstrap accounts for:
  #   - `plugins install` refuses without --accept-capabilities;
  #   - `plugins.allow` is an allowlist for EVERY plugin, bundled ones included
  #     (["health-plugin"] left only memory-core + health-plugin enabled, no
  #     anthropic provider, no device-pair) -- so it must stay unset.
  tag: "2026.9.9"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 18789
  # Widget sandbox listener (gateway port + 1). show_widget and dashboard
  # widgets render from this separate origin; without a public route the
  # Control UI shows "widget sandbox host unavailable" (2026-10-09).
  sandboxPort: 18790

persistence:
  storageClass: nfs-client
  accessModes:
    - ReadWriteOnce
  size: 5Gi

env:
  tz: UTC
  # consumed by the gateway-config-bootstrap initContainer's
  # `openclaw config set gateway.controlUi.allowedOrigins` call — there is
  # no working env var for this setting (OPENCLAW_ALLOWED_ORIGINS is not
  # read by the gateway; see commands.md)
  allowedOrigins: "https://openclaw.srvx.cc"
  # Advertised in mobile pairing setup codes / QR (Control UI "Pair device",
  # `openclaw qr`) via `plugins.entries.device-pair.config.publicUrl`. Without
  # it the code falls through to the last resolution step, `gateway.bind=lan`,
  # and embeds the pod IP (`ws://10.233.x.x:18789`) -- unreachable from a phone.
  # Must be wss:// -- pairing fails closed on public ws:// (2026-09-18).
  # The bundled device-pair plugin is disabled by default; the bootstrap
  # enables it, otherwise every CLI call warns "plugin disabled but config is
  # present" (the QR still honoured the URL, but the config belongs to it).
  publicUrl: "wss://openclaw.srvx.cc"
  # Models (2026-10-09): everything goes through OpenRouter and only to
  # zero-data-retention endpoints -- health data, medications and intimate
  # habits reach the model, and neither Anthropic direct nor DeepSeek direct
  # had ZDR. Enforced twice: on the OpenRouter account (privacy settings, all
  # model groups) and per request (`params.provider` below). Claude 5.5 has
  # ZDR only on Google Vertex and Amazon Bedrock. Refs resolve against
  # OpenRouter's live catalog; note the dot in the slug (claude-sonnet-5.5).
  # Spike: anamnestic-claw docs, 2026-10-09; verified live in a container.
  # Default is DeepSeek V4 Pro (owner's choice 2026-10-09: 2-3x cheaper than
  # Sonnet for everyday text). Text only -- pdf/image go to mediaModel. Its
  # ZDR route is pinned to US hosts below (SiliconFlow and other China-based
  # ZDR hosts are excluded). Sonnet/Opus stay one tap away in the picker.
  model: "openrouter/deepseek/deepseek-v4-pro"
  # Tried in order when the primary fails with a failover-worthy error. A model
  # picked by hand in a session is strict and does not fall back.
  modelFallbacks:
    - openrouter/anthropic/claude-sonnet-5.5
    - openrouter/anthropic/claude-haiku-5.5
  # pdf and image tools. Sonnet 5.5 answers HTTP 400 "Reasoning is mandatory"
  # when thinking is off, and these tools call their model without thinking;
  # Haiku 5.5 accepts it (verified on a real lab PDF).
  mediaModel: "openrouter/anthropic/claude-haiku-5.5"
  # agents.defaults.models: picker aliases plus the per-request routing. The
  # bootstrap replaces the whole map, so stale direct-provider entries go.
  models:
    openrouter/anthropic/claude-sonnet-5.5:
      alias: "sonnet-5.5"
      params: &zdr
        provider:
          zdr: true
          data_collection: deny
          only: [google-vertex, amazon-bedrock]
          allow_fallbacks: true
    openrouter/anthropic/claude-haiku-5.5:
      alias: "haiku-5.5"
      params: *zdr
    openrouter/anthropic/claude-opus-5.5:
      alias: "opus-5.5"
      params: *zdr
    openrouter/deepseek/deepseek-v4-pro:
      alias: "deepseek"
      params:
        provider:
          zdr: true
          data_collection: deny
          only: [azure, deepinfra, together, parasail]
          allow_fallbacks: true
  # Automatic compaction. Unset, a phone session grew to 159k tokens before
  # anything trimmed it, re-reading all of it (cache) on every message. 300kb of
  # visible transcript triggers a summary -- roughly 60-80k tokens -- and
  # notifyUser shows "Compacting context..." in the chat when it happens.
  compaction:
    maxActiveTranscriptBytes: "300kb"
    notifyUser: true
  # gateway.trustedProxies. 2026.9 answers 403 {"type":"proxy_attribution_required"}
  # to every request that carries X-Forwarded-* headers from an address not
  # listed here -- which is all of them, since everything arrives through
  # ingress-nginx. Found 2026-09-18 right after the 2026.9.4 bump: the Android
  # app and the browser both got 403 on "/", /healthz (no forwarded headers)
  # still 200. Kept to the cluster's pod subnet (kubespray podSubnet), where
  # ingress-nginx lives; nothing outside the cluster can present itself from
  # these addresses.
  trustedProxies: '["10.233.64.0/18"]'
  # Voice (2026-10-09: STT/TTS moved from OpenAI direct to OpenRouter ZDR).
  # Live Talk is the owner-approved exception: OpenRouter has no realtime API,
  # so it stays on OpenAI directly (no ZDR) with its own key name. speechLocale is the recognition
  # locale pushed to device nodes. Both STT models and the TTS model are on
  # OpenRouter's ZDR endpoint list (Groq, ElevenLabs) and were verified on a
  # Russian round trip (TTS -> STT, word for word).
  voice:
    speechLocale: "ru-RU"
    audioLanguage: "ru"
    talkProvider: "system"
    realtimeModel: "gpt-realtime-2.1"
    audioModels:
      - provider: openrouter
        model: openai/whisper-large-v3-turbo
        capabilities: [audio]
      - provider: openrouter
        model: elevenlabs/scribe-v2
        capabilities: [audio]
    audioPreferredModel: "openrouter/openai/whisper-large-v3-turbo"
    # tts.providers.openrouter. ElevenLabs needs its own voice id (the
    # provider default af_alloy is a kokoro voice and is rejected); this is the
    # premade "George". Gemini TTS was rejected: it only returns pcm.
    tts:
      model: elevenlabs/eleven-multilingual-v2
      speakerVoice: JBFqnCBsd6RMkjVDRZzb
      responseFormat: mp3

resources:
  limits:
    cpu: "1"
    # 1Gi -> 2Gi on 2026-09-19. On 2026.9.4 the gateway idles at 350-560 MiB
    # with 14 plugins loaded and warns itself at rss 512 MiB; the first cron
    # agent turn with a retry (weight-reminder, 09:00 UTC) went from ~380 MiB
    # past 1Gi in twelve seconds and was OOMKilled. One event, but the
    # headroom was the problem, not the job.
    # 2Gi -> 3Gi on 2026-10-09. On 2026.9.9 with 16 plugins the gateway idles
    # at rss 1.3-1.4 GiB (heap only ~300 MiB); the 18:00 UTC evening check-in
    # cron (DeepSeek, 74 tools) pushed it past 2Gi -> OOMKilled. Request
    # raised to the observed idle so the scheduler reserves it.
    memory: 3Gi
  requests:
    cpu: 100m
    memory: 1536Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
affinity: {}
tolerations: []

ingress:
  enabled: true
  className: nginx
  host: openclaw.srvx.cc
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # No nginx Basic Auth in front of the gateway any more (owner's decision,
    # 2026-09-18): the browser prompt doubled up with OpenClaw's own
    # authentication -- gateway token plus device pairing -- and that layer is
    # now the only perimeter on this public host. If a second layer is wanted
    # again, prefer Cloudflare Access over auth-type: basic.
    external-dns.alpha.kubernetes.io/hostname: openclaw.srvx.cc
    external-dns.alpha.kubernetes.io/target: b16e4df1-2f22-4512-a7bc-29b1ed11d754.cfargotunnel.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"

# Public origin of the widget sandbox (mcp.apps.sandboxOrigin). It must differ
# from the Control UI origin and must not host authenticated content.
sandboxIngress:
  enabled: true
  host: openclaw-sandbox.srvx.cc

gatewayTokenSecretName: openclaw-gateway-token
# Provider API keys (ANTHROPIC_API_KEY) -- see templates/secrets.yaml.
modelKeysSecretName: openclaw-model-keys

healthPlugin:
  # Enabled 2026-09-08, after the plugin was ported to the OpenClaw 2026.7.x
  # plugin API. Two separate problems had to be fixed before this could be true:
  #
  #   1. nazman/anamnestic-claw-plugin:main did not exist on Docker Hub at all.
  #   2. Once built, it still would not install: the plugin was written against
  #      an older API (bare default-export register function, ctx.config.get,
  #      handler(args), no id/configSchema/contracts.tools in the manifest).
  #
  # Verified in a container before flipping this: `openclaw plugins install`
  # succeeds and `openclaw plugins inspect health-plugin --runtime --json`
  # reports status=loaded, activated=true and all seven tools. The first attempt
  # at enabling this skipped that check and took openclaw down - with
  # strategy: Recreate, a plugin that cannot start is an outage, not a degraded
  # rollout, which is precisely why this flag exists. Do not flip it without
  # running the install in a container first.
  #
  # The image is built from ../anamnestic-claw/plugin on the same openclaw base
  # tag as image.tag above, so plugin and core cannot drift apart. Rebuild and
  # push after any change to that source - "main" is mutable, hence
  # pullPolicy: Always below.
  #
  # health-plugin-token is gated on this same flag, so the Secret and its only
  # consumer appear and disappear together.
  enabled: true
  image:
    repository: nazman/anamnestic-claw-plugin
    tag: "main"
    # Always (not IfNotPresent): tag is a floating "main" tag, so a node
    # that already cached an older "main" image must still pull the latest
    # digest on every pod start, or plugin updates can silently never land.
    pullPolicy: Always
  backendUrl: "http://anamnestic-claw.anamnestic-claw.svc.cluster.local:8000"
  # Sent by the plugin as X-User-Id on every backend call. Single-user
  # stopgap until identity comes from the tool-call context (spec
  # 2026-09-18-mood-checkin-and-history-design.md §2). MUST equal the value
  # migration 0002 backfilled existing weight rows to, or history stops
  # seeing them.
  defaultUserId: "legacy-single-user"
  tokenSecretName: health-plugin-token

# Monitoring objects, rendered by templates/monitoring.yaml -- the canonical
# copy from chart-lib/. See CLAUDE.md: every chart in this repo ships its own
# ServiceMonitor and PrometheusRule, because a workload whose monitoring is
# created by hand somewhere else is a workload that will one day be deployed
# without it and nobody will notice.
monitoring:
  serviceMonitor:
    # /metrics returns the web UI's HTML -- the SPA answers every unknown path.
    # There is no instrumentation to scrape.
    enabled: false
  rules:
    enabled: true
    labels:
      release: prometheus
    alertPrefix: Openclaw
    workloads:
      - name: openclaw
        container: openclaw
