image:
  repository: ghcr.io/openclaw/openclaw
  tag: "2026.6.34"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 18789

persistence:
  storageClass: nfs-client
  accessModes:
    - ReadWriteOnce
  size: 5Gi

env:
  tz: UTC
  allowedOrigins: "https://openclaw.srvx.cc"

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 512Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false

nodeSelector: {}
affinity: {}
tolerations: []

ingress:
  enabled: false   # turned on in Task 3

gatewayTokenSecretName: openclaw-gateway-token
basicAuthSecretName: openclaw-basic-auth
manageSecrets: false   # secrets are applied by hand (see Task 4) — Helm never renders/manages them
