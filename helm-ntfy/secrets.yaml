#
# Referenced from ntfy.yaml as `secrets://secrets.yaml` and decrypted by the
# helm-secrets downloader plugin on argocd-repo-server. Not a manifest: never
# move this under templates/, where Helm would render the ciphertext verbatim.
#
# authUsers entries are "username:bcrypt-hash:role", rotated 2026-09-10 at
# cost 12 after the previous hashes spent 130 days in this public repo.
#
# authTokens entries are "username:token:label". They are declared here because
# ntfy 2.28 appears to accept only config-provisioned tokens for
# config-provisioned users: the user rows carry provisioned=1 (they come from
# authUsers) while a token created with `ntfy token add` lands with
# provisioned=0, and such a token is refused with 401 even seconds after being
# created. Basic auth with the password works throughout, which is what pins the
# failure to the token path rather than to the credentials.
