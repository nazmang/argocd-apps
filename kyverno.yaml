apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: local
  source:
    repoURL: "https://kyverno.github.io/kyverno/"
    chart: kyverno
    targetRevision: "3.8.2"
    # No `helm: {}` here: the apiserver drops the empty map, so apps-root saw
    # this Application as permanently OutOfSync and resynced it every few
    # minutes (2026-09-20).
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # The chart renders `metadata.annotations: {}` and `labels: {}` on its
  # eleven CRDs; the apiserver drops empty maps, so with server-side apply
  # every CRD diffed forever and selfHeal resynced the app every few minutes
  # (found 2026-09-20, first day Argo CD was scraped). Labels and
  # annotations on CRDs carry nothing functional here.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
  info:
    - name: upstream
      value: "https://kyverno.io"
    - name: purpose
      value: "admission-controller: проверка cosign-подписи Docker-образов (см. ai-language-tutor/docs/16-security.md)"
