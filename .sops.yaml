# Every rule here is scoped to an exact path. There is deliberately NO catch-all:
# if `sops -e` says "no matching creation rules found", that is the design — add
# an explicit rule for the new file rather than letting a broad regex guess which
# of its fields are sensitive.
#
# Changing this file does NOT affect decryption of already-encrypted files: sops
# records the encrypted_regex it used inside each file's own `sops:` metadata
# block. These rules govern new encryption only.
#
# Single recipient, the repo's age key. Private half lives in .age/age.key
# (gitignored, mode 600) and is copied into the cluster as the argocd Secret
# helm-secrets-private-keys — see docs/argocd-repo-server-helm-secrets.md.
creation_rules:
  # --- ArgoCD-reconciled, decrypted by helm-secrets on argocd-repo-server ---

  # Helm VALUES file (not a manifest) consumed via `secrets://secrets.yaml`.
  #
  # The key list is explicit, and a new key MUST be added here before it is
  # added to secrets.yaml — otherwise sops writes it in PLAINTEXT into a
  # committed file. A prefix regex (`^(N8N_.*)$`) was tried and rejected: n8n's
  # own configuration is full of secrets that do not start with N8N_
  # (DB_POSTGRESDB_PASSWORD, QUEUE_BULL_REDIS_PASSWORD, SMTP_PASS,
  # OPENAI_API_KEY), so the prefix would silently commit the next one in the
  # clear. An explicit list is self-enforcing: forget it and `sops -e` leaves
  # the value unencrypted where it is visible in review and to gitleaks.
  - path_regex: helm-n8n/secrets\.yaml$
    age: "age1wp7n5rlrjdqjx7hpkfv35ejwauuggyncl0cu4zllcq59a696sudqnucqfe"
    encrypted_regex: ^(N8N_ENCRYPTION_KEY|N8N_BASIC_AUTH_USER|N8N_BASIC_AUTH_PASSWORD|s3-key|s3-secret|dockerconfigjson)$

  # ntfy's auth users: "username:bcrypt-hash:role" entries for ntfy's
  # auth-users config key. The hashes are credential material -- bcrypt cost 10
  # is respectable but it is still an offline-crackable handle on the password,
  # and this repo is public. They sat in helm-ntfy/values.yaml in the clear from
  # 2026-05-03 (commit 11878f6) until this migration.
  #
  # Only authUsers is listed. authAccess is topic ACLs, not credentials, and
  # stays in values.yaml where it is reviewable. If a future key here does carry
  # a secret -- upstreamAccessToken, smtpSenderPass, webPushPrivateKey,
  # twilioAuthToken, stripeSecretKey are all in ntfy's config surface -- add it
  # to this list BEFORE putting it in secrets.yaml, or sops writes it in
  # plaintext into a committed file.
  - path_regex: helm-ntfy/secrets\.yaml$
    age: "age1wp7n5rlrjdqjx7hpkfv35ejwauuggyncl0cu4zllcq59a696sudqnucqfe"
    encrypted_regex: ^(authUsers|authTokens)$

  # ntfy-alertmanager's ntfy credential. The bridge publishes to the cloud-k8s
  # topic, which is deny-all like every other, so without a working token every
  # alert is refused with 401 -- the same silent nowhere the bridge exists to fix.
  #
  # NOTE: ntfy only accepts tokens that are also declared in helm-ntfy's
  # authTokens (see the ntfy note in CLAUDE.md). A token added with
  # `ntfy token add` and pasted here alone will be rejected.
  - path_regex: helm-ntfy-alertmanager/secrets\.yaml$
    age: "age1wp7n5rlrjdqjx7hpkfv35ejwauuggyncl0cu4zllcq59a696sudqnucqfe"
    encrypted_regex: ^(ntfyAccessToken)$

  # --- ArgoCD-reconciled, decrypted by ksops via a kustomize generator ---

  # data key is literally named "vault-init.yaml" (kubectl create secret
  # --from-file=vault-init.yaml), hence the odd-looking regex.
  - path_regex: helm-vault/auto-unseal/vault-init-secret\.yaml$
    age: "age1wp7n5rlrjdqjx7hpkfv35ejwauuggyncl0cu4zllcq59a696sudqnucqfe"
    encrypted_regex: ^(vault-init\.yaml)$

  - path_regex: helm-ansible-semaphore/semaphore/secret\.yaml$
    age: "age1wp7n5rlrjdqjx7hpkfv35ejwauuggyncl0cu4zllcq59a696sudqnucqfe"
    encrypted_regex: ^(password|email)$

  # --- Applied by hand with `sops -d ... | kubectl apply`, never by ArgoCD ---
  # See helm-openclaw/commands.md and helm-anamnestic-claw/commands.md for why
  # these live at chart root instead of templates/.

  - path_regex: helm-openclaw/secrets\.yaml$
    age: "age1wp7n5rlrjdqjx7hpkfv35ejwauuggyncl0cu4zllcq59a696sudqnucqfe"
    encrypted_regex: ^(OPENCLAW_GATEWAY_TOKEN|auth|password|BACKEND_TOKEN)$

  - path_regex: helm-anamnestic-claw/secrets\.yaml$
    age: "age1wp7n5rlrjdqjx7hpkfv35ejwauuggyncl0cu4zllcq59a696sudqnucqfe"
    encrypted_regex: ^(SQLCIPHER_KEY|API_BEARER_TOKEN)$

  # --- Local operator artefacts, never committed (.gitignore'd) ---
  # Vault's `operator init` output. Gitignored via
  # helm-vault/auto-unseal/.gitignore (`vault-init.*`), but encrypted at rest so
  # a 3-of-5 unseal quorum is not sitting in plaintext on a laptop.
  - path_regex: helm-vault/auto-unseal/vault-init\.(yaml|json)$
    age: "age1wp7n5rlrjdqjx7hpkfv35ejwauuggyncl0cu4zllcq59a696sudqnucqfe"
    encrypted_regex: ^(unseal_keys_b64|unseal_keys_hex|recovery_keys_b64|recovery_keys_hex|root_token)$
