apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stock-bot
  namespace: argocd
spec:
  project: local
  source:
    repoURL: https://github.com/nazmang/argocd-apps.git
    targetRevision: main
    path: helm-stock-bot
    helm:
      releaseName: stock-bot
      valueFiles:
        - values.yaml
        # SOPS-encrypted, decrypted by helm-secrets on argocd-repo-server.
        - secrets://secrets.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: stock-bot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  info:
    - name: purpose
      value: "Telegram bot, SQLite on a PVC"
    # Apply this file only once helm-stock-bot/secrets.yaml exists (the owner
    # inserts the tokens) and image.digest points at a built image. Until then
    # the chart refuses to render, on purpose.
