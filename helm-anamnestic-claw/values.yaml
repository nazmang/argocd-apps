image:
  repository: nazman/anamnestic-claw
  # TODO: replace with a real CI-built tag once GitHub Actions is wired up (no GitHub remote exists yet for anamnestic-claw)
  tag: "bootstrap"
  # Always, not IfNotPresent: "bootstrap" is a mutable tag that gets rebuilt and
  # pushed by hand, so IfNotPresent would silently keep serving whatever the node
  # already cached. This is also what the cluster was actually running before the
  # chart came under ArgoCD on 2026-09-08 - the chart said IfNotPresent and the
  # live Deployment said Always, and adopting the chart as written would have
  # been a real behaviour change disguised as an ownership transfer.
  pullPolicy: Always

# Бэкап БД: CronJob снимает зашифрованный снимок (VACUUM INTO) и кладёт его
# в MinIO. Litestream здесь неприменим: он открывает базу как обычный
# SQLite-клиент и на SQLCipher получает "file is not a database (26)", при
# этом НЕ падая — см. спеку 2026-09-24-backups-minio-design.md §1.
backup:
  enabled: true
  schedule: "0 */6 * * *"
  bucket: anamnestic-claw-backups
  s3ClientImage: amazon/aws-cli:2.31.15
  # Сертификат MinIO самоподписанный (cert-manager ClusterIssuer
  # selfsigned-issuer, secret minio-api-tls в namespace minio-operator) —
  # первый запуск джоба, скорее всего, упадёт на проверке сертификата.
  #
  # Смонтировать CA тенанта и задать AWS_CA_BUNDLE было бы правильнее, но
  # не сделано здесь: секрет с CA живёт в чужом для этого чарта namespace
  # minio-operator, в кластере нет механизма кросс-неймспейсного sync'а
  # секретов (проверено — ни Reflector, ни external-secrets не установлены,
  # см. helm-n8n/values.yaml, известный риск "kube API over unverified TLS"
  # с той же нерешённой проблемой), а у selfsigned-issuer лист-сертификат
  # сам себе CA — то есть ca.crt меняется при каждом продлении (валидность
  # 90 дней, продление обычно на 2/3 срока), и захардкоженная в git копия
  # тихо устареет и уронит джоб заново, просто позже.
  #
  # Решение при первом реальном отказе: поставить `insecure: true` (включает
  # --no-verify-ssl для AWS CLI). Это приемлемо здесь потому, что адрес —
  # внутрикластерный (`https://minio.minio-operator.svc`), трафик не выходит
  # за пределы кластера, а credential-material в этом соединении — только
  # заливка бэкапа сервисным аккаунтом без прав на удаление (см. ранбук
  # 2026-09-24-minio-bucket-setup.md). Это НЕ "уже решённый" вопрос —
  # решение принимается в момент первого отказа, а не заранее.
  #
  # 2026-09-25: отказ случился на первом же прогоне — aws-cli вернул
  # SSL CERTIFICATE_VERIFY_FAILED ("unable to get local issuer certificate").
  # Включено true. Почему это приемлемо: адрес внутрикластерный
  # (minio.minio-operator.svc), канал остаётся TLS — не проверяется только
  # цепочка, — а содержимое объекта зашифровано SQLCipher независимо от
  # транспорта, так что перехват даёт нечитаемые байты. Альтернатива с
  # монтированием CA отвергнута: секрет лежит в чужом namespace, механизма
  # синхронизации в кластере нет, а лист-сертификат ротируется каждые
  # ~60-90 дней — скопированный вручную CA однажды молча сломает бэкап.
  insecure: true
  # Алерт, если успешного бэкапа не было дольше N часов (два пропущенных цикла).
  staleAfterHours: 12

# Хранилище оригиналов документов (анализы, заключения, голосовые заметки).
# Отдельный бакет и отдельный сервисный аккаунт от бэкапного: здесь нужен
# ещё и GetObject (файл надо уметь отдать обратно для повторного
# распознавания и для будущего письма врачу), и нет expiration — анализ
# пятилетней давности это ровно то, что нужно врачу, в отличие от
# 90-дневных бэкапов базы. Бакет, политика и аккаунт созданы вручную по
# ранбуку 2026-09-25-minio-documents-bucket-setup.md в репозитории
# anamnestic-claw, а не чартом: MinIO управляется оператором в чужом
# namespace. Права сервисного аккаунта: PutObject, GetObject, ListBucket —
# DeleteObject намеренно не выдан.
documents:
  enabled: true
  bucket: anamnestic-claw-documents
  # Та же причина, что у backup.insecure выше: сертификат MinIO
  # самоподписанный, CA лежит в чужом namespace и ротируется каждые
  # ~60-90 дней. Канал остаётся TLS, не проверяется только цепочка,
  # адрес внутрикластерный.
  insecure: true

replicaCount: 1

service:
  type: ClusterIP
  port: 8000

persistence:
  storageClass: nfs-client
  accessModes:
    - ReadWriteOnce
  size: 1Gi

env:
  databasePath: /data/health.db

resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
affinity: {}
tolerations: []

secretName: anamnestic-claw-secrets

# Monitoring objects, rendered by templates/monitoring.yaml -- the canonical
# copy from chart-lib/. See CLAUDE.md: every chart in this repo ships its own
# ServiceMonitor and PrometheusRule, because a workload whose monitoring is
# created by hand somewhere else is a workload that will one day be deployed
# without it and nobody will notice.
monitoring:
  serviceMonitor:
    # FastAPI with /healthz but no /metrics yet. Three lines of
    # prometheus-fastapi-instrumentator would change that; until then there is
    # nothing to scrape.
    enabled: false
  rules:
    enabled: true
    labels:
      release: prometheus
    alertPrefix: AnamnesticClaw
    workloads:
      - name: anamnestic-claw
        container: anamnestic-claw
