{{- /*
  Наружу — два пути для скриптов на большом ПК: GET /gate/generation (pause.py, спека
  anamnestic-claw 2026-10-28-urge-protocol-and-daily-fields-design.md §5) и POST /gate/sessions
  (ask.py, спека 2026-10-31-alcohol-sexuality-design.md §4); для агента Кати — GET /gate/safe-mode
  и POST /gate/purchases (спека 2026-11-10-katya-safe-mode-purchases-design.md), GET /gate/training
  (спека 2026-11-11-training-supplements-design.md). Остальной API снаружи недоступен:
  pathType Exact, других правил нет.
*/}}
{{- if .Values.gateIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "anamnesticClaw.fullname" . }}-gate
  labels:
    {{- include "anamnesticClaw.labels" . | nindent 4 }}
  {{- with .Values.gateIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.gateIngress.className }}
  rules:
    - host: {{ .Values.gateIngress.host }}
      http:
        paths:
          - path: /gate/generation
            pathType: Exact
            backend:
              service:
                name: {{ include "anamnesticClaw.fullname" . }}
                port:
                  name: http
          - path: /gate/sessions
            pathType: Exact
            backend:
              service:
                name: {{ include "anamnesticClaw.fullname" . }}
                port:
                  name: http
          - path: /gate/safe-mode
            pathType: Exact
            backend:
              service:
                name: {{ include "anamnesticClaw.fullname" . }}
                port:
                  name: http
          - path: /gate/purchases
            pathType: Exact
            backend:
              service:
                name: {{ include "anamnesticClaw.fullname" . }}
                port:
                  name: http
          - path: /gate/training
            pathType: Exact
            backend:
              service:
                name: {{ include "anamnesticClaw.fullname" . }}
                port:
                  name: http
{{- end }}
