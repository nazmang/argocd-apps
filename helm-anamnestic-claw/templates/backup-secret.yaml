{{- /*
  Отдельный Secret, а не ключи в anamnestic-claw-secrets, намеренно: он
  монтируется ТОЛЬКО в контейнер заливки бэкапа, который не должен знать
  SQLCIPHER_KEY. Контейнер со снимком, наоборот, не имеет доступа наружу.
  Это §5.3 ТЗ («ключ отдельно от бэкапа»), доведённое до уровня контейнеров.

  Значения приходят из helm-anamnestic-claw/secrets.yaml — SOPS-зашифрованного
  *values*-файла, который ArgoCD расшифровывает плагином helm-secrets.
  Зашифрованному файлу нельзя лежать под templates/: Helm рендерит всё отсюда
  дословно и про SOPS ничего не знает.
*/}}
{{- if .Values.backup.enabled }}
{{- $b := .Values.backupMinio | default dict }}
{{- $missing := list }}
{{- range $k := list "s3-endpoint" "s3-key" "s3-secret" }}
  {{- if not (get $b $k) }}{{- $missing = append $missing $k }}{{- end }}
{{- end }}
{{- if $missing }}
  {{- fail (printf "\n\nMissing or empty .Values.backupMinio key(s): %s\nThe backup CronJob cannot upload anything without them.\nRender with the encrypted values file:\n  helm template anamnestic-claw ./helm-anamnestic-claw -f <(sops -d helm-anamnestic-claw/secrets.yaml)\nOr set backup.enabled=false to turn the backup off deliberately.\n" (join ", " $missing)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anamnesticClaw.fullname" . }}-backup-minio
  labels:
    {{- include "anamnesticClaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  s3-endpoint: {{ get $b "s3-endpoint" | quote }}
  s3-key: {{ get $b "s3-key" | quote }}
  s3-secret: {{ get $b "s3-secret" | quote }}
{{- end }}
