{{- /*
  Отдельный Secret от anamnestic-claw-secrets и от backup-minio, намеренно:
  у трёх наборов кредов разная область. Сервисный аккаунт документов умеет
  Put, Get и List в одном бакете и НЕ умеет удалять — удаление документа у
  нас мягкое, запись в базе помечается удалённой, а файл в MinIO остаётся.
  Скомпрометированный под не должен мочь стереть историю анализов человека.

  Значения приходят из helm-anamnestic-claw/secrets.yaml — SOPS-зашифрованного
  *values*-файла, который ArgoCD расшифровывает плагином helm-secrets.
  Зашифрованному файлу нельзя лежать под templates/: Helm рендерит всё отсюда
  дословно и про SOPS ничего не знает — именно так в этом репозитории однажды
  уехал ENC[...] в живой Secret в качестве значения.
*/}}
{{- if .Values.documents.enabled }}
{{- $d := .Values.documentsMinio | default dict }}
{{- $missing := list }}
{{- range $k := list "s3-endpoint" "s3-key" "s3-secret" }}
  {{- if not (get $d $k) }}{{- $missing = append $missing $k }}{{- end }}
{{- end }}
{{- if $missing }}
  {{- fail (printf "\n\nMissing or empty .Values.documentsMinio key(s): %s\nБез них загрузка документов вернёт 503, а бэкенд поднимется как ни в чём не бывало.\nРендерить с зашифрованным values-файлом:\n  helm template anamnestic-claw ./helm-anamnestic-claw -f <(sops -d helm-anamnestic-claw/secrets.yaml)\nЛибо осознанно выключить: documents.enabled=false.\n" (join ", " $missing)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anamnesticClaw.fullname" . }}-documents-minio
  labels:
    {{- include "anamnesticClaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  s3-endpoint: {{ get $d "s3-endpoint" | quote }}
  s3-key: {{ get $d "s3-key" | quote }}
  s3-secret: {{ get $d "s3-secret" | quote }}
{{- end }}
