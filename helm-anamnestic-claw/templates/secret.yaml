{{- /*
  Values come from helm-anamnestic-claw/secrets.yaml, a SOPS-encrypted *values*
  file that ArgoCD decrypts through the helm-secrets downloader plugin (see
  anamnestic-claw.yaml's valueFiles and docs/argocd-repo-server-helm-secrets.md).

  Until 2026-09-08 this chart's Secret was an encrypted manifest at the chart
  root, applied by hand with `sops -d | kubectl apply` before every
  `helm upgrade`, because there was no way for ArgoCD to decrypt anything. That
  is now solved, so the chart is ArgoCD-managed and the manifest is gone.

  Never move an encrypted file under templates/. Helm renders everything there
  verbatim and knows nothing about SOPS — that is how this repo once shipped
  ENC[...] ciphertext into a live Secret as if it were the value.

  SQLCIPHER_KEY in particular must never render empty or wrong: the on-disk
  database is encrypted with those exact key bytes (raw-key form, no
  passphrase derivation), so a bad value is not a failed auth, it is an
  unreadable database and a crash loop. See commands.md before rotating it.
*/}}
{{- $secrets := .Values.secrets | default dict }}
{{- $missing := list }}
{{- range $k := list "SQLCIPHER_KEY" "API_BEARER_TOKEN" }}
  {{- if not (get $secrets $k) }}{{- $missing = append $missing $k }}{{- end }}
{{- end }}
{{- if $missing }}
  {{- fail (printf "\n\nMissing or empty .Values.secrets key(s): %s\nThis chart must be rendered with the encrypted values file:\n  helm template anamnestic-claw ./helm-anamnestic-claw -f <(sops -d helm-anamnestic-claw/secrets.yaml)\nArgoCD does this via `secrets://secrets.yaml` in anamnestic-claw.yaml.\nRendering without it would create an empty anamnestic-claw-secrets Secret;\nwith no SQLCIPHER_KEY the pod cannot open its database at all.\n" (join ", " $missing)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: anamnestic-claw-secrets
  labels:
    {{- include "anamnesticClaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
