apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-pull-secret
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: minio
  annotations:
    # Before minio-operator (wave 8): the tenant must find the Secret.
    argocd.argoproj.io/sync-wave: '7'
spec:
  project: local
  source:
    repoURL: https://github.com/nazmang/argocd-apps.git
    targetRevision: main
    path: helm-minio/pull-secret
    helm:
      releaseName: minio-pull-secret
      valueFiles:
        - values.yaml
        # SOPS-encrypted, decrypted by helm-secrets on argocd-repo-server.
        # Its own single-source Application: the minio-operator Application is
        # multi-source, and the secrets:// prefix cannot follow a $ref.
        - secrets://secrets.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: minio-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  info:
    - name: purpose
      value: "Pull secret ghcr-minio for the tenant image ghcr.io/nazmang/minio (upstream quay.io tag is gone)"
