{{- if .Values.httpRoute.enabled }}
{{- $gw := .Values.httpRoute.gateway }}
# Route on the kgateway Gateway `public` (k8s helm-kgateway), next to the
# Ingress until the tunnel rule points here. The Gateway already gives what the
# Ingress annotations did: no request timeout and 1h stream idle (long
# WebSockets), WebSocket upgrades on the listener, no body size limit.
# Host and Cf-Access-Jwt-Assertion pass through unchanged.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
  name: {{ include "pluggio.fullname" . }}
  labels:
    {{- include "pluggio.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gw.name }}
      namespace: {{ $gw.namespace }}
  hostnames: [{{ .Values.ingress.host | quote }}]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ include "pluggio.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
