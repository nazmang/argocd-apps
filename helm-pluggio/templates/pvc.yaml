apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pluggio.fullname" . }}
  labels:
    {{- include "pluggio.labels" . | nindent 4 }}
  annotations:
    # All state is in this volume and local-path deletes it with the claim:
    # an Application prune or a chart rename must not take it along.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
