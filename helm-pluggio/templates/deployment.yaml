apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pluggio.fullname" . }}
  labels:
    {{- include "pluggio.labels" . | nindent 4 }}
spec:
  replicas: 1
  # The new pod starts next to the old one (same node: local-path volume) and
  # waits for the lease; the old one finishes replies, saves and hands over.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "pluggio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pluggio.labels" . | nindent 8 }}
      annotations:
        # envFrom is resolved at pod creation; roll the pod when a key changes.
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      enableServiceLinks: false
      imagePullSecrets:
        - name: {{ include "pluggio.fullname" . }}-ghcr
      containers:
        - name: pluggio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "pluggio.fullname" . }}-env
          volumeMounts:
            - name: data
              mountPath: /data
          # Until the old pod hands over, the new one does not listen yet: up to 2.5 min.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "pluggio.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
