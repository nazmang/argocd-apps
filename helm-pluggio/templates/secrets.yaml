{{- /*
  Rendered from helm-pluggio/secrets.yaml, a SOPS-encrypted values file that
  ArgoCD decrypts with helm-secrets (pluggio.yaml: secrets://secrets.yaml).
  Never put ciphertext under templates/.

  secrets.env becomes the pod's environment as is: the LLM keys, the bridge
  token and the Cloudflare Access settings (team, aud, owner email, the bridge's
  service-token Client ID). Without the Access ones the server refuses to listen
  on 0.0.0.0 and crash-loops, so they are required here, loudly.
*/}}
{{- $s := .Values.secrets | default dict }}
{{- $env := $s.env | default dict }}
{{- $missing := list }}
{{- range list "ANTHROPIC_API_KEY" "PLUGGIO_BRIDGE__TOKEN" "PLUGGIO_ACCESS__TEAM" "PLUGGIO_ACCESS__AUD" "PLUGGIO_ACCESS__OWNERS" "PLUGGIO_ACCESS__BRIDGE_CLIENT_ID" }}
  {{- if not (get $env .) }}{{- $missing = append $missing (printf "secrets.env.%s" .) }}{{- end }}
{{- end }}
{{- if not $s.dockerconfigjson }}{{- $missing = append $missing "secrets.dockerconfigjson" }}{{- end }}
{{- if $missing }}
  {{- fail (printf "\n\nMissing or empty value(s): %s\nRender with the encrypted values file:\n  helm template pluggio ./helm-pluggio -f <(sops -d helm-pluggio/secrets.yaml)\nArgoCD does this via `secrets://secrets.yaml` in pluggio.yaml.\n" (join ", " $missing)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pluggio.fullname" . }}-env
  labels:
    {{- include "pluggio.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pluggio.fullname" . }}-ghcr
  labels:
    {{- include "pluggio.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ $s.dockerconfigjson | quote }}
